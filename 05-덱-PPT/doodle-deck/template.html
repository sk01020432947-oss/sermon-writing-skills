<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Doodle Deck</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Nanum+Pen+Script&display=swap">
<style>
:root{
  --paper:#F5F3EF;      /* 따뜻한 미색 종이. 순백(#fff) 금지 */
  --ink:#353535;        /* 소프트 블랙 마커. 순검정(#000) 금지 */
  --red:#CE2E3C;        /* 현재 어절 하이라이트 · 붉은 손글씨 주석 */
  --gray:#ABA9A7;       /* 아직 안 읽은 어절 */
  --pill:#FFFEFC;       /* 자막 알약 바탕 */
  --stroke:5px;         /* 손그림 기본 획 (1920 기준 4~6px) */
  /* 파스텔 채색 — 이 6색 밖으로 나가지 않는다 */
  --p-blue:#D8EAFB; --p-green:#CEF3DF; --p-peach:#FDE0C1;
  --p-pink:#F3C3A8; --p-brown:#C89766; --p-sky:#D9E8FA;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;background:#111;overflow:hidden}
body{font-family:Gaegu,"Nanum Pen Script","Pretendard Variable",sans-serif;color:var(--ink)}

#stage{position:absolute;top:50%;left:50%;width:1920px;height:1080px;
  transform:translate(-50%,-50%) scale(var(--scale,1));transform-origin:center;background:var(--paper)}
.slide{position:absolute;inset:0;display:none;background:var(--paper)}
.slide.active{display:block}

/* ───────── 그림 배치: .art 하나 = 좌표계 하나(1px = SVG 1단위) ───────── */
.art{position:absolute}
/* 잉크 규칙은 .art의 '직계' svg에만 — 손 아이콘 svg까지 먹지 않게 */
.art>svg{display:block;overflow:visible;filter:url(#rough)}
.art>svg path,.art>svg line,.art>svg circle,.art>svg ellipse{
  fill:none;stroke:var(--ink);stroke-width:var(--stroke);
  stroke-linecap:round;stroke-linejoin:round}

/* 선이 그려진다 — 모든 애니메이션 path에 pathLength="100" 필수 */
.draw{stroke-dasharray:100;stroke-dashoffset:100}
.active .draw{animation:drawIn var(--dur,1.1s) var(--d,0s) ease forwards}
@keyframes drawIn{to{stroke-dashoffset:0}}

/* 채색은 선이 다 그려진 뒤 톡 들어온다.
   색은 반드시 style="--c:var(--p-blue)"로 준다 — fill 속성은 위 CSS(fill:none)에 진다 */
.art .fill{fill:var(--c,var(--ink));stroke:none;opacity:0;transform-box:fill-box;transform-origin:center}
.active .fill{animation:popIn .42s var(--d,0s) cubic-bezier(.3,1.5,.5,1) forwards}
@keyframes popIn{from{opacity:0;transform:scale(.86)}to{opacity:1;transform:scale(1)}}

/* 손글씨 라벨 (검정/빨강) */
.label{position:absolute;font-size:52px;font-weight:700;white-space:nowrap;opacity:0}
.label.red{color:var(--red)}
.active .label{animation:popIn .4s var(--d,0s) ease forwards}

/* ───────── 연필 쥔 손 — 그려지는 획을 따라간다 ───────── */
.hand{position:absolute;left:0;top:0;width:130px;height:130px;opacity:0;z-index:3;
  offset-distance:0%;offset-rotate:0deg;offset-anchor:7% 93%;pointer-events:none;
  filter:drop-shadow(0 6px 8px rgba(0,0,0,.14))}
.hand svg{width:130px;height:130px;display:block}
.active .hand{animation:trace var(--dur,1.1s) var(--d,0s) ease forwards,
                        handFade var(--dur,1.1s) var(--d,0s) ease forwards}
@keyframes trace{from{offset-distance:0%}to{offset-distance:100%}}
@keyframes handFade{0%{opacity:0}6%{opacity:1}88%{opacity:1}100%{opacity:0}}

/* ───────── 하단 자막 알약 (어절 단위 카라오케) ───────── */
.cap{position:absolute;left:50%;bottom:7.5%;transform:translateX(-50%);z-index:9;
  display:flex;align-items:center;gap:44px;max-width:82%;flex-wrap:nowrap;
  background:var(--pill);border:3.5px solid var(--ink);border-radius:999px;
  padding:16px 40px;box-shadow:0 9px 20px rgba(0,0,0,.10)}
.cap .w{font-size:40px;font-weight:700;color:var(--ink);white-space:nowrap;
  padding:2px 6px;border-radius:10px;transition:color .18s,background .18s}
.cap .w.ahead{color:var(--gray)}
.cap .w.now{background:var(--red);color:#fff;padding:4px 16px}

@media print{
  html,body{overflow:visible;background:var(--paper)}
  #stage{position:static;transform:none;width:auto;height:auto}
  .slide{display:block!important;position:relative;width:1920px;height:1080px;page-break-after:always}
  .draw{stroke-dashoffset:0!important;animation:none!important}
  .fill,.label{opacity:1!important;animation:none!important;transform:none!important}
  .hand{display:none}
  #nav{display:none}
}
@page{size:1920px 1080px;margin:0}
#nav{position:fixed;right:24px;bottom:16px;z-index:99;color:#999;font-size:16px;font-family:Gaegu,sans-serif}
</style>
</head>

<script>
const slides=[...document.querySelectorAll('.slide')];
const navPage=document.getElementById('navPage');
const WORD_MS=520;              // 어절당 머무는 시간
const SHOT=location.search.indexOf('shot')>-1;   // 캡처 모드: 자막을 다 읽은 상태로 고정
let cur=-1,timer=null;

function buildCap(slide){
  if(slide.querySelector('.cap')||!slide.dataset.cap)return;
  const cap=document.createElement('div');
  cap.className='cap';
  slide.dataset.cap.trim().split(/\s+/).forEach(w=>{
    const s=document.createElement('span');
    s.className='w ahead';s.textContent=w;cap.appendChild(s);
  });
  slide.appendChild(cap);
}
slides.forEach(buildCap);

function runCap(slide){
  clearInterval(timer);
  const ws=[...slide.querySelectorAll('.cap .w')];
  if(!ws.length)return;
  if(SHOT){ws.forEach(w=>w.className='w');return;}
  ws.forEach(w=>{w.className='w ahead'});
  let i=0;
  const step=()=>{
    ws.forEach((w,k)=>w.className='w'+(k===i?' now':k>i?' ahead':''));
    if(++i>=ws.length){clearInterval(timer);
      setTimeout(()=>ws.forEach(w=>w.className='w'),WORD_MS);}
  };
  step();timer=setInterval(step,WORD_MS);
}

function show(n){
  cur=Math.max(0,Math.min(slides.length-1,n));
  slides.forEach((s,i)=>s.classList.toggle('active',i===cur));
  navPage.textContent=(cur+1)+' / '+slides.length;
  runCap(slides[cur]);
}
addEventListener('keydown',e=>{
  if(e.key==='ArrowRight'||e.key===' ')show(cur+1);
  else if(e.key==='ArrowLeft')show(cur-1);
  else if(e.key==='Home')show(0);
  else if(e.key==='End')show(slides.length-1);
});
addEventListener('click',e=>{if(e.clientX<innerWidth/2)show(cur-1);else show(cur+1)});
let tx=null;
addEventListener('touchstart',e=>tx=e.touches[0].clientX);
addEventListener('touchend',e=>{if(tx===null)return;
  const dx=e.changedTouches[0].clientX-tx;
  if(dx<-40)show(cur+1);else if(dx>40)show(cur-1);tx=null});
function fit(){
  const s=Math.min(innerWidth/1920,innerHeight/1080);
  document.getElementById('stage').style.setProperty('--scale',s);
}
addEventListener('resize',fit);addEventListener('load',fit);fit();
const _h=parseInt(location.hash.slice(1));show(isNaN(_h)?0:_h-1);
addEventListener('hashchange',()=>{const n=parseInt(location.hash.slice(1));if(!isNaN(n))show(n-1)});
if(SHOT)document.getElementById('nav').style.display='none';
</script>
</body>
</html>

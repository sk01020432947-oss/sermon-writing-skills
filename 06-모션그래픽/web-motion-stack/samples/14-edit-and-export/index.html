<body data-no="G06" data-cat="문법 · 수정" data-ko="말로 고치고 4K로 출력" data-en="Edit & Export" data-meta="11초 · 요청→부분 수정→MP4 3840×2160·60fps" data-dur="11" data-poster="10.4" data-size="1280x720">
<main class="scene"><div class="bg"></div>
  <div class="tag" style="left:64px;top:60px"><b>05</b>수정하고, 출력하기</div>
  <div class="panel win" id="win"><div class="bar2"><i></i><i></i><i></i>&nbsp; web-motion / index.html</div>

<script>
const tk = document.getElementById('ticks'); for (let i = 0; i < 60; i++) tk.insertAdjacentHTML('beforeend', '<i></i>');
const fc = {v: 0};
const tl = Motion.timeline();
tl.from('#win', {y: 24, autoAlpha: 0, duration: .6}, 0);
tl.from('#q1', {y: 14, autoAlpha: 0, duration: .4}, .8); tl.from('#a1', {y: 14, autoAlpha: 0, duration: .4}, 1.8);
tl.to('#topt,#bot', {autoAlpha: 0, y: 6, duration: .5}, 2.0);
tl.from('#q2', {y: 14, autoAlpha: 0, duration: .4}, 3.0); tl.from('#a2', {y: 14, autoAlpha: 0, duration: .4}, 4.0);
tl.to('#pb', {autoAlpha: 0, y: 6, duration: .5}, 4.2);
tl.from('#q3', {y: 14, autoAlpha: 0, duration: .4}, 5.2);
tl.to('#win', {scale: .3, autoAlpha: 0, x: -100, duration: .7, ease: 'power3.in'}, 6.0);
tl.to('#file', {opacity: 1, duration: .1}, 6.6); tl.from('#file', {scale: .5, y: 20, duration: .6, ease: 'back.out(2)'}, 6.6);
tl.to('#spec', {opacity: 1, duration: .1}, 7.0); tl.from('#spec > *', {x: 20, autoAlpha: 0, stagger: .1, duration: .4}, 7.0);
tl.to(fc, {v: 60, duration: 2.2, ease: 'none', onUpdate() { const n = Math.round(fc.v); document.getElementById('fc').textContent = n; tk.querySelectorAll('i').forEach((e, i) => e.style.background = i < n ? '#3ee6a8' : 'rgba(255,255,255,.12)'); }}, 7.6);
tl.from('#a3', {y: 14, autoAlpha: 0, duration: .4}, 9.6);
Motion.ready();
</script></body></html>

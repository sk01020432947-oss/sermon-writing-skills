<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><title>글씨의 표현과 오타 확률 · Type &amp; Gauge</title>
<link rel="stylesheet" href="../../lib/stage.css">
<style>
.frame{background:#0b1012 !important;background-image:none !important}
.scene{position:absolute;inset:0;overflow:hidden;font-family:Pretendard,'Noto Sans KR',sans-serif;color:#e9f1ef;letter-spacing:-.01em}
.bg{position:absolute;inset:0;background:radial-gradient(55% 75% at 12% -5%,#15493e 0%,rgba(21,73,62,0) 70%),radial-gradient(55% 75% at 105% 105%,#2c2257 0%,rgba(44,34,87,0) 70%),#0b1012}
.tag{position:absolute;display:flex;gap:8px;align-items:center;font:600 12px/1 'IBM Plex Mono',monospace;letter-spacing:.12em;color:#9fb3ae;text-transform:uppercase;white-space:nowrap}
.tag b{background:#3ee6a8;color:#06231a;padding:3px 6px;border-radius:4px;font-weight:700}
.panel{position:absolute;background:rgba(18,26,28,.82);border:1px solid rgba(255,255,255,.09);border-radius:12px}
.code{font:13px/1.75 'IBM Plex Mono',monospace;color:#b9c9c4;white-space:pre}
.chip{position:absolute;padding:7px 14px;border-radius:999px;border:1px solid rgba(62,230,168,.45);color:#bff5df;font:600 14px/1 Pretendard;background:rgba(62,230,168,.08);white-space:nowrap}
.mint{color:#3ee6a8}.red{color:#ff5d4f}

.ph{position:absolute;inset:0}
.big{position:absolute;left:0;right:0;top:120px;text-align:center;font:200 120px/1 Pretendard;white-space:nowrap}
.big span{display:inline-block}
.rule{position:absolute;left:180px;right:180px;top:330px;height:2px;background:rgba(62,230,168,.5)}
.wts{position:absolute;left:180px;right:180px;top:360px;display:flex;justify-content:space-between}
.wts div{text-align:center;font-size:70px;line-height:1}
.wts small{display:block;font:500 12px 'IBM Plex Mono';color:#7c8f8a;margin-top:12px}
.cmp{position:absolute;top:120px;width:500px;height:300px}
.cmp .cap2{position:absolute;left:16px;top:14px;font:700 13px Pretendard;color:#cfdcd8}
.sign{position:absolute;left:60px;top:80px;width:380px;height:120px;border-radius:10px;background:#3b2a2a;display:flex;align-items:center;justify-content:center;font:900 54px Pretendard;color:#f6e7c9}
.gz{position:absolute;left:680px;top:120px}
.msg{position:absolute;left:120px;top:470px;width:1040px;text-align:center;font:700 26px/1.5 Pretendard}
</style></head>
<body data-no="G08" data-cat="문법 · 글자" data-ko="글씨의 표현과 오타 확률" data-en="Type & Typo Gauge" data-meta="10초 · 굵기 100~900 물결, 그림 속 글자 vs 코드 속 글자" data-dur="10" data-poster="9.4" data-size="1280x720">
<main class="scene"><div class="bg"></div>
  <div class="ph" id="a">
    <div class="tag" style="left:64px;top:60px"><b>01</b>정확한 글자</div>
    <div class="big" id="bg"></div><div class="rule" id="ru"></div>
    <div class="wts" id="wt"></div>
  </div>
  <div class="ph" id="b" style="opacity:0">
    <div class="tag" style="left:64px;top:60px"><b>01</b>정확한 글자</div>
    <div class="panel cmp" style="left:90px"><span class="cap2">AI 이미지 속 글자</span><div class="sign" id="s1"></div></div>
    <svg class="gz" width="500" height="300"><path d="M90 250 A160 160 0 0 1 410 250" fill="none" stroke="rgba(255,255,255,.12)" stroke-width="18" stroke-linecap="round"/><path d="M90 250 A160 160 0 0 1 150 125" fill="none" stroke="#3ee6a8" stroke-width="18" stroke-linecap="round"/><path d="M350 125 A160 160 0 0 1 410 250" fill="none" stroke="#ff5d4f" stroke-width="18" stroke-linecap="round"/><g id="nd"><line x1="250" y1="250" x2="250" y2="110" stroke="#e9f1ef" stroke-width="5" stroke-linecap="round"/><circle cx="250" cy="250" r="12" fill="#e9f1ef"/></g><text x="250" y="40" text-anchor="middle" font-family="Pretendard" font-weight="800" font-size="22" fill="#e9f1ef">오타 확률</text><text x="90" y="290" text-anchor="middle" font-family="Pretendard" font-size="14" fill="#9fb3ae">낮음</text><text x="410" y="290" text-anchor="middle" font-family="Pretendard" font-size="14" fill="#9fb3ae">높음</text></svg>
    <div class="msg" id="mg">코드 속 글자는 <span class="mint">텍스트 그대로</span> 그려진다 — 오타 확률은 AI 답변의 오타 수준</div>
  </div>
</main>
<script src="../../lib/gsap.min.js"></script><script src="../../lib/stage.js"></script>
<script>
const word = '글씨의 표현';
document.getElementById('bg').innerHTML = [...word].map(c => `<span>${c === ' ' ? '&nbsp;' : c}</span>`).join('');
document.getElementById('wt').innerHTML = [100,200,300,400,500,600,700,800,900].map(w => `<div style="font-weight:${w}">가<small>${w}</small></div>`).join('');
// 그림 속 글자: 의도적으로 획이 뒤섞인 '가짜 글자' → 코드 글자로 교체
const fake = '앵복안 빵집', real = '행복한 빵집', st = {k: 0}, mix = {p: 0};
const r = Motion.rand(16);
const glyphs = '앵뷁앙빵짚햏봑힌뺑잡'.split('');
function sign() { const s1 = document.getElementById('s1'); const n = Math.floor(mix.p * real.length); s1.innerHTML = [...real].map((c, i) => i < n ? `<span style="color:#3ee6a8">${c === ' ' ? '&nbsp;' : c}</span>` : `<span style="display:inline-block;transform:rotate(${(Math.sin(i * 7) * 14).toFixed(0)}deg) scaleX(${1 + Math.sin(i * 3) * .2})">${c === ' ' ? '&nbsp;' : glyphs[(i * 3 + 1) % glyphs.length]}</span>`).join(''); }
const chars = [...document.querySelectorAll('#bg span')], ws = [...document.querySelectorAll('#wt div')];
function wave() { const t = st.k; chars.forEach((e, i) => { e.style.fontWeight = Math.round(100 + 800 * (.5 + .5 * Math.sin(t * 3 - i * .7))); }); ws.forEach((e, i) => e.style.transform = `translateY(${(-14 * Math.max(0, Math.sin(t * 3 - i * .55))).toFixed(1)}px)`); }
const tl = Motion.timeline();
tl.to(st, {k: 5, duration: 5, ease: 'none', onUpdate: wave}, 0);
tl.from('#bg span', {y: 40, autoAlpha: 0, stagger: .06, duration: .5}, .1);
tl.from('#ru', {scaleX: 0, duration: .8}, .4);
tl.from('#wt div', {y: 20, autoAlpha: 0, stagger: .06, duration: .4}, .6);
tl.to('#a', {autoAlpha: 0, duration: .5}, 4.6);
tl.to('#b', {opacity: 1, duration: .5}, 4.9);
const ndl = {a: 70}, nd = document.getElementById('nd'), setN = () => nd.setAttribute('transform', `rotate(${ndl.a} 250 250)`);
tl.to(ndl, {a: -62, duration: 1.4, ease: 'elastic.out(1,.5)', onUpdate: setN}, 6.0);
setN();
tl.to(mix, {p: 1, duration: 1.6, ease: 'none', onUpdate: sign}, 6.6);
tl.from('#mg', {y: 20, autoAlpha: 0, duration: .6}, 7.6);
wave(); sign();
Motion.ready();
</script></body></html>

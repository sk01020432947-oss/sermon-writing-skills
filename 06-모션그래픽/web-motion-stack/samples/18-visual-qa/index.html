<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><title>보이는 게 전부: 눈으로 검수 · Visual QA</title>
<link rel="stylesheet" href="../../lib/stage.css">
<style>
.frame{background:#0b1012 !important;background-image:none !important}
.scene{position:absolute;inset:0;overflow:hidden;font-family:Pretendard,'Noto Sans KR',sans-serif;color:#e9f1ef;letter-spacing:-.01em}
.bg{position:absolute;inset:0;background:radial-gradient(55% 75% at 12% -5%,#15493e 0%,rgba(21,73,62,0) 70%),radial-gradient(55% 75% at 105% 105%,#2c2257 0%,rgba(44,34,87,0) 70%),#0b1012}
.tag{position:absolute;display:flex;gap:8px;align-items:center;font:600 12px/1 'IBM Plex Mono',monospace;letter-spacing:.12em;color:#9fb3ae;text-transform:uppercase;white-space:nowrap}
.tag b{background:#3ee6a8;color:#06231a;padding:3px 6px;border-radius:4px;font-weight:700}
.panel{position:absolute;background:rgba(18,26,28,.82);border:1px solid rgba(255,255,255,.09);border-radius:12px}
.code{font:13px/1.75 'IBM Plex Mono',monospace;color:#b9c9c4;white-space:pre}
.chip{position:absolute;padding:7px 14px;border-radius:999px;border:1px solid rgba(62,230,168,.45);color:#bff5df;font:600 14px/1 Pretendard;background:rgba(62,230,168,.08);white-space:nowrap}
.mint{color:#3ee6a8}.red{color:#ff5d4f}

.pl{left:80px;top:170px;width:580px;height:330px}
.pt{position:absolute;left:36px;top:92px;font:900 50px Pretendard}
.ps{position:absolute;left:38px;top:160px;font:500 15px Pretendard;color:#9fb3ae}
.pr{position:absolute;left:36px;right:36px;bottom:50px;height:3px;background:rgba(255,255,255,.15)}
.pd{position:absolute;bottom:43px;width:16px;height:16px;border-radius:50%;background:#3ee6a8;left:36px}
.tc{position:absolute;right:20px;top:16px;font:600 12px 'IBM Plex Mono';color:#cfdcd8}
.cir{position:absolute;right:70px;top:90px}
.mk{position:absolute;width:24px;height:24px;border-radius:50%;background:#ff5d4f;color:#fff;font:900 15px/24px Pretendard;text-align:center;box-shadow:0 0 0 6px rgba(255,93,79,.25)}
.hd{position:absolute;left:80px;top:72px;font:900 46px Pretendard}
.lst{position:absolute;left:720px;top:200px;width:480px}
.lst .cap2{font:600 13px Pretendard;color:#9fb3ae;margin-bottom:16px}
.it{display:flex;align-items:center;gap:14px;padding:16px 18px;border-radius:10px;background:rgba(18,26,28,.82);border:1px solid rgba(255,255,255,.09);margin-bottom:12px;font:700 19px Pretendard}
.it .eye{color:#3ee6a8}.it .st{margin-left:auto;width:26px;height:26px;border-radius:50%;background:#ff5d4f;color:#fff;font:900 15px/26px Pretendard;text-align:center}
</style></head>
<body data-no="G10" data-cat="문법 · 검수" data-ko="보이는 게 전부: 눈으로 검수" data-en="Visual QA" data-meta="10초 · 문제 표시 → 체크리스트 → 수정 완료" data-dur="10" data-poster="9.4" data-size="1280x720">
<main class="scene"><div class="bg"></div>
  <div class="hd" id="hd">보이는 게 <span class="mint">전부</span></div>
  <div class="panel pl" id="pl"><span class="tc" id="tc">00:19</span>
    <div class="pt" id="pt">보이는 그대로</div><div class="ps" id="ps">코드로 만든 영상</div>
    <svg class="cir" width="110" height="110"><circle cx="55" cy="55" r="46" fill="none" stroke="#3ee6a8" stroke-width="3" stroke-dasharray="9 8"/></svg>
    <div class="pr"></div><div class="pd" id="pd"></div>
    <div class="mk" id="m1" style="left:300px;top:250px">!</div><div class="mk" id="m2" style="left:205px;top:150px">!</div><div class="mk" id="m3" style="left:520px;top:40px">!</div>
  </div>
  <div class="lst"><div class="cap2" id="lc">눈으로 바로 보이는 문제</div>
    <div class="it" id="i1"><span class="eye">◉</span>움직임이 어색하다<span class="st">!</span></div>
    <div class="it" id="i2"><span class="eye">◉</span>글자가 너무 작다<span class="st">!</span></div>
    <div class="it" id="i3"><span class="eye">◉</span>장면이 너무 빠르다 · 구성이 어긋났다<span class="st">!</span></div>
  </div>
</main>
<script src="../../lib/gsap.min.js"></script><script src="../../lib/stage.js"></script>
<script>
const tl = Motion.timeline();
tl.from('#hd', {y: 20, autoAlpha: 0, duration: .5}, 0);
tl.from('#pl', {y: 24, autoAlpha: 0, duration: .5}, .2);
tl.to('#pd', {x: 480, duration: 9, ease: 'none'}, .5);
tl.to({v: 19}, {v: 46, duration: 9, ease: 'none', onUpdate() { document.getElementById('tc').textContent = '00:' + String(Math.round(this.targets()[0].v)).padStart(2, '0'); }}, .5);
tl.from('#lc', {autoAlpha: 0, duration: .4}, 1.0);
// 문제 발견: 흔들리는 움직임 / 작은 글자 / 기울어진 구성
[['#m1', '#i1', 1.4], ['#m2', '#i2', 2.4], ['#m3', '#i3', 3.4]].forEach(([m, it, t]) => { tl.from(m, {scale: 0, duration: .4, ease: 'back.out(3)'}, t); tl.from(it, {x: 30, autoAlpha: 0, duration: .4}, t + .15); });
tl.to('#pd', {y: -6, duration: .08, yoyo: true, repeat: 9, ease: 'none'}, 1.4);
tl.to('#ps', {fontSize: 11, duration: .3}, 2.4);
tl.to('#pt', {rotation: -4, y: 8, duration: .3}, 3.4);
// 수정: 한 줄 요청 → 모두 바로잡힘
tl.to('#ps', {fontSize: 18, duration: .5}, 5.6);
tl.to('#pt', {rotation: 0, y: 0, duration: .5}, 5.9);
['#i1', '#i2', '#i3'].forEach((s, i) => tl.to(s + ' .st', {background: '#3ee6a8', color: '#06231a', duration: .3, onStart() {}, onUpdate() {}}, 5.6 + i * .4).call(() => {}, null, 5.6 + i * .4));
tl.to('.mk', {scale: 0, stagger: .2, duration: .3}, 5.6);
tl.to('.it', {borderColor: 'rgba(62,230,168,.5)', stagger: .4, duration: .3}, 5.6);
Motion.ready();
</script></body></html>

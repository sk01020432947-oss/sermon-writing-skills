<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><title>Three.js 카메라 연출 · 3D Camera</title>
<link rel="stylesheet" href="../../lib/stage.css">
<style>
.frame{background:#0b1012 !important;background-image:none !important}
.scene{position:absolute;inset:0;overflow:hidden;font-family:Pretendard,'Noto Sans KR',sans-serif;color:#e9f1ef;letter-spacing:-.01em}
.bg{position:absolute;inset:0;background:radial-gradient(55% 75% at 12% -5%,#15493e 0%,rgba(21,73,62,0) 70%),radial-gradient(55% 75% at 105% 105%,#2c2257 0%,rgba(44,34,87,0) 70%),#0b1012}
.tag{position:absolute;display:flex;gap:8px;align-items:center;font:600 12px/1 'IBM Plex Mono',monospace;letter-spacing:.12em;color:#9fb3ae;text-transform:uppercase;white-space:nowrap}
.tag b{background:#3ee6a8;color:#06231a;padding:3px 6px;border-radius:4px;font-weight:700}
.panel{position:absolute;background:rgba(18,26,28,.82);border:1px solid rgba(255,255,255,.09);border-radius:12px}
.code{font:13px/1.75 'IBM Plex Mono',monospace;color:#b9c9c4;white-space:pre}
.chip{position:absolute;padding:7px 14px;border-radius:999px;border:1px solid rgba(62,230,168,.45);color:#bff5df;font:600 14px/1 Pretendard;background:rgba(62,230,168,.08);white-space:nowrap}
.mint{color:#3ee6a8}.red{color:#ff5d4f}

#gl{position:absolute;inset:0;width:1280px;height:720px}
.hud{position:absolute;inset:34px;pointer-events:none}
.hud i{position:absolute;width:34px;height:34px;border:2px solid rgba(233,241,239,.75)}
.rec{position:absolute;left:56px;top:50px;font:600 15px 'IBM Plex Mono';color:#ff5d4f;letter-spacing:.06em}
.lens{position:absolute;right:62px;bottom:52px;font:600 14px 'IBM Plex Mono';color:#cfdcd8}
.big{position:absolute;left:64px;bottom:96px;font:800 40px/1.2 Pretendard;text-shadow:0 2px 20px rgba(0,0,0,.6)}
</style></head>
<body data-no="W06" data-cat="기술 · THREE.JS" data-ko="3D 공간과 카메라 이동" data-en="3D Camera Move" data-meta="10초 · 오브젝트·조명·카메라 돌리인과 궤도" data-dur="10" data-poster="8.6" data-size="1280x720">
<main class="scene">
  <canvas id="gl"></canvas>
  <div class="hud"><i style="left:0;top:0;border-right:0;border-bottom:0"></i><i style="right:0;top:0;border-left:0;border-bottom:0"></i><i style="left:0;bottom:0;border-right:0;border-top:0"></i><i style="right:0;bottom:0;border-left:0;border-top:0"></i></div>
  <div class="rec">● REC <span id="tc">00:00:00:00</span></div>
  <div class="lens">35mm · f 2.0</div>
  <div class="tag" style="left:64px;top:84px"><b>04</b>THREE.JS</div>
  <div class="big" id="b1">카메라가 <span class="mint">공간 안으로</span></div>
  <div class="big" id="b2" style="opacity:0">카메라가 <span class="mint">물체 주변으로</span></div>
</main>
<script src="three.min.js"></script>
<script src="../../lib/gsap.min.js"></script><script src="../../lib/stage.js"></script>
<script>
const r = Motion.rand(6), DPR = window.devicePixelRatio || 1;
const renderer = new THREE.WebGLRenderer({canvas: document.getElementById('gl'), antialias: true, preserveDrawingBuffer: true});
renderer.setPixelRatio(DPR); renderer.setSize(1280, 720, false);
const scene = new THREE.Scene(); scene.background = new THREE.Color('#0b1012'); scene.fog = new THREE.Fog('#0b1012', 18, 46);
const cam = new THREE.PerspectiveCamera(40, 1280 / 720, .1, 100);
scene.add(new THREE.HemisphereLight('#bfeee0', '#1a1430', .7));
const key = new THREE.DirectionalLight('#ffffff', 1.6); key.position.set(6, 10, 6); scene.add(key);
const rim = new THREE.PointLight('#8b7bff', 40, 30); rim.position.set(-6, 3, -4); scene.add(rim);
const mat = (c, o = {}) => new THREE.MeshStandardMaterial(Object.assign({color: c, roughness: .35, metalness: .25, flatShading: true}, o));
const hero = new THREE.Mesh(new THREE.IcosahedronGeometry(1.6, 0), mat('#2f8f7a')); hero.position.y = 1.6; scene.add(hero);
const objs = [
  [new THREE.ConeGeometry(.9, 1.8, 4), mat('#3a4a48'), [-3.2, .9, -1.5]],
  [new THREE.BoxGeometry(1.1, 1.1, 1.1), mat('#34403e'), [3.4, .55, -2]],
  [new THREE.TorusGeometry(.8, .22, 12, 40), mat('#5f6b69'), [2.6, .8, 2.2]],
  [new THREE.SphereGeometry(.7, 16, 12), mat('#4b5755', {wireframe: true}), [-2.6, .7, 2.4]],
  [new THREE.OctahedronGeometry(.6, 0), mat('#ff5d4f'), [0, .6, -4]]];
const meshes = objs.map(([geo, m, p]) => { const o = new THREE.Mesh(geo, m); o.position.set(...p); scene.add(o); return o; });
const grid = new THREE.GridHelper(60, 60, '#1f4b42', '#16302b'); scene.add(grid);
// 떠다니는 먼지(결정론 난수)
const dust = new THREE.BufferGeometry(), dp = []; for (let i = 0; i < 600; i++) dp.push((r() - .5) * 40, r() * 10, (r() - .5) * 40);
dust.setAttribute('position', new THREE.Float32BufferAttribute(dp, 3));
scene.add(new THREE.Points(dust, new THREE.PointsMaterial({color: '#3ee6a8', size: .05, transparent: true, opacity: .6})));
// 카메라 경로: 0~4.5초 멀리서 공간 안으로 돌리인, 4.5~10초 물체 주변 궤도
const st = {t: 0};
const ease = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
function draw() {
  const t = st.t;
  if (t < 4.5) { const k = ease(t / 4.5); cam.position.set(0, 6 - 3.4 * k, 28 - 20 * k); }
  else { const k = ease((t - 4.5) / 5.5), a = k * Math.PI * 1.1; cam.position.set(Math.sin(a) * 8, 2.6 + Math.sin(a) * .8, Math.cos(a) * 8); }
  cam.lookAt(0, 1.4, 0);
  hero.rotation.set(t * .35, t * .5, 0);
  meshes.forEach((m, i) => { m.rotation.y = t * (.3 + i * .1); m.position.y += 0; });
  renderer.render(scene, cam);
  const f = Math.floor(t * 30); document.getElementById('tc').textContent = `00:00:${String(Math.floor(t)).padStart(2, '0')}:${String(f % 30).padStart(2, '0')}`;
}
const tl = Motion.timeline();
tl.to(st, {t: 10, duration: 10, ease: 'none', onUpdate: draw}, 0);
tl.from('#b1', {y: 24, autoAlpha: 0, duration: .6}, .5);
tl.to('#b1', {y: -16, autoAlpha: 0, duration: .4}, 4.3);
tl.fromTo('#b2', {y: 24, opacity: 0}, {y: 0, opacity: 1, duration: .6}, 4.8);
draw();
Motion.ready();
</script></body></html>

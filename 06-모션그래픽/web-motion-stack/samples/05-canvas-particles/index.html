<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><title>캔버스 파티클 · Canvas Particles</title>
<link rel="stylesheet" href="../../lib/stage.css">
<style>
.frame{background:#0b1012 !important;background-image:none !important}
.scene{position:absolute;inset:0;overflow:hidden;font-family:Pretendard,'Noto Sans KR',sans-serif;color:#e9f1ef;letter-spacing:-.01em}
.bg{position:absolute;inset:0;background:radial-gradient(55% 75% at 12% -5%,#15493e 0%,rgba(21,73,62,0) 70%),radial-gradient(55% 75% at 105% 105%,#2c2257 0%,rgba(44,34,87,0) 70%),#0b1012}
.tag{position:absolute;display:flex;gap:8px;align-items:center;font:600 12px/1 'IBM Plex Mono',monospace;letter-spacing:.12em;color:#9fb3ae;text-transform:uppercase;white-space:nowrap}
.tag b{background:#3ee6a8;color:#06231a;padding:3px 6px;border-radius:4px;font-weight:700}
.panel{position:absolute;background:rgba(18,26,28,.82);border:1px solid rgba(255,255,255,.09);border-radius:12px}
.code{font:13px/1.75 'IBM Plex Mono',monospace;color:#b9c9c4;white-space:pre}
.chip{position:absolute;padding:7px 14px;border-radius:999px;border:1px solid rgba(62,230,168,.45);color:#bff5df;font:600 14px/1 Pretendard;background:rgba(62,230,168,.08);white-space:nowrap}
.mint{color:#3ee6a8}.red{color:#ff5d4f}

#cv{position:absolute;left:470px;top:60px;width:760px;height:600px;border-radius:14px;background:rgba(10,16,18,.6);border:1px solid rgba(255,255,255,.07)}
.w{position:absolute;left:64px;font:800 48px/1 Pretendard;color:#4c5b58}
.cap3{position:absolute;left:64px;top:520px;font:500 17px/1.6 Pretendard;color:#9fb3ae}
</style></head>
<body data-no="W05" data-cat="기술 · CANVAS" data-ko="흩어지고 튕기고 반응하는 입자" data-en="Canvas Particles" data-meta="9초 · 입자 420개 물리 시뮬레이션" data-dur="9" data-poster="6.5" data-size="1280x720">
<main class="scene"><div class="bg"></div>
  <div class="tag" style="left:64px;top:110px"><b>05</b>03 / 05 · CANVAS 2D</div>
  <div class="w" id="w1" style="top:200px">흩어지고</div>
  <div class="w" id="w2" style="top:280px">튕기고</div>
  <div class="w" id="w3" style="top:360px">반응하고</div>
  <div class="cap3">픽셀을 직접 칠하는 도화지.<br>수백~수천 개를 매 프레임 계산해 그린다.</div>
  <canvas id="cv"></canvas>
</main>
<script src="../../lib/gsap.min.js"></script><script src="../../lib/stage.js"></script>
<script>
// 결정론: 시뮬레이션을 로드 시 30fps로 미리 계산(precompute)해 두고, seek(t)는 해당 프레임을 그리기만 한다.
const cv = document.getElementById('cv'), W = 760, H = 600, DPR = window.devicePixelRatio || 1;
cv.width = W * DPR; cv.height = H * DPR; const g = cv.getContext('2d'); g.scale(DPR, DPR);
const r = Motion.rand(5), N = 420, FPS = 30, F = Math.ceil(9 * FPS) + 1;
const COL = ['#3ee6a8', '#3ee6a8', '#8b7bff', '#ff5d4f', '#e9f1ef'];
const P = []; for (let i = 0; i < N; i++) { const a = r() * Math.PI * 2, s = 4 + r() * 9; P.push({x: W / 2, y: H / 2, vx: Math.cos(a) * s, vy: Math.sin(a) * s, c: COL[i % 5], rad: 2 + r() * 3}); }
const frames = new Array(F);
for (let f = 0; f < F; f++) {
  const t = f / FPS, ax = W / 2 + Math.cos(t * 1.3) * 230, ay = H / 2 + Math.sin(t * 1.9) * 170; // 움직이는 반발점
  for (const p of P) {
    if (t > 3.0) { const dx = p.x - ax, dy = p.y - ay, d2 = dx * dx + dy * dy + 400; if (d2 < 22000) { p.vx += dx / d2 * 90; p.vy += dy / d2 * 90; } }
    if (t > 1.6 && t < 3.0) p.vy += .12;   // 잠시 중력: 바닥에 튕긴다
    p.vx *= .985; p.vy *= .985; p.x += p.vx; p.y += p.vy;
    if (p.x < p.rad || p.x > W - p.rad) { p.vx *= -.9; p.x = Math.max(p.rad, Math.min(W - p.rad, p.x)); }
    if (p.y < p.rad || p.y > H - p.rad) { p.vy *= -.82; p.y = Math.max(p.rad, Math.min(H - p.rad, p.y)); }
  }
  frames[f] = {pts: P.map(p => [p.x, p.y]), ax, ay};
}
const st = {t: 0};
function draw() {
  const f = Math.min(F - 1, Math.round(st.t * FPS)), fr = frames[f];
  g.clearRect(0, 0, W, H);
  g.strokeStyle = 'rgba(255,255,255,.04)'; for (let x = 0; x < W; x += 40) { g.beginPath(); g.moveTo(x, 0); g.lineTo(x, H); g.stroke(); } for (let y = 0; y < H; y += 40) { g.beginPath(); g.moveTo(0, y); g.lineTo(W, y); g.stroke(); }
  if (st.t > 3.0) { g.strokeStyle = 'rgba(62,230,168,.5)'; g.lineWidth = 1.5; g.beginPath(); g.arc(fr.ax, fr.ay, 60, 0, 7); g.stroke(); }
  fr.pts.forEach((q, i) => { g.fillStyle = P[i].c; g.beginPath(); g.arc(q[0], q[1], P[i].rad, 0, 7); g.fill(); });
}
const tl = Motion.timeline();
tl.to(st, {t: 9, duration: 9, ease: 'none', onUpdate: draw}, 0);
tl.from('#cv', {autoAlpha: 0, scale: .96, duration: .5}, 0);
[['#w1', .2], ['#w2', 1.6], ['#w3', 3.0]].forEach(([s, t]) => tl.to(s, {color: '#3ee6a8', x: 10, duration: .4}, t).to(s, {color: '#e9f1ef', x: 0, duration: .4}, t + 1.3));
draw();
Motion.ready();
</script></body></html>

<script>
const tl = Motion.timeline();
const B = 0.5; // 1 beat @120BPM
const $ = s => document.querySelector(s);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const ease=u=>u<.5?4*u*u*u:1-Math.pow(-2*u+2,3)/2;
const hash=n=>{n=Math.sin(n*127.1)*43758.5453;return n-Math.floor(n);};
const CH = [ // [start, id, label, hudColor]
  [0,'c1','PATTERN','#fff'],[2,'c2','MATERIAL','#fff'],[4,'c3','TYPE','#0b0b0c'],[6,'c4','SPACE','#fff'],
  [8,'c5','DATA','#0b0b0c'],[10,'c6','RHYTHM','#fff'],[11.5,'c7','SOUND','#fff'],[12.5,'c8','CODE','#fff'],[13.5,'c9','','#fff']];
const segs = $('#segs'); for(let i=0;i<8;i++) segs.appendChild(document.createElement('i'));

/* ---------- 01 PATTERN: diagonal wave of squares <-> circles ---------- */
const PC=[], NCx=16, NRy=9, GX=80, GY=80, OX=(1280-(NCx-1)*GX)/2-23, OY=(720-(NRy-1)*GY)/2-23;
for(let r=0;r<NRy;r++)for(let c=0;c<NCx;c++){const d=document.createElement('div');d.className='pc';d.style.left=(OX+c*GX)+'px';d.style.top=(OY+r*GY)+'px';$('#pcs').appendChild(d);PC.push({d,r,c});}
function drawPattern(t){
  const dark=t>=1.0;
  $('#c1').style.background=dark?'#0b0b0c':'#E9502F';
  for(const p of PC){
    const k=t*1.5-(p.c+p.r)*0.075, n=Math.floor(k), e=ease(clamp(k-n,0,1)), u=n+e;
    const s=0.5+0.5*Math.cos(Math.PI*u);           // 1 = circle, 0 = square
    const intro=ease(clamp((t-(p.c+p.r)*0.018)/0.35,0,1));
    const sc=(0.3+0.7*intro)*(1-0.22*Math.sin(Math.PI*e));   // never empty: first frame already shows the dot field
    p.d.style.borderRadius=(7+16*s)+'px';
    p.d.style.background=dark?'#E9502F':'#F6F1EA';
    p.d.style.transform=`rotate(${(u*90).toFixed(2)}deg) scale(${sc.toFixed(3)})`;
  }
}

/* ---------- 02 MATERIAL: endless cube field (canvas projection) + chrome blob ---------- */
const cv2=$('#cv2'), g2=cv2.getContext('2d');
const mix=(a,b,f)=>a.map((v,i)=>Math.round(v+(b[i]-v)*f));
const rgb=a=>`rgb(${a[0]},${a[1]},${a[2]})`;
const FOG=[214,106,70], TOP=[238,232,224], FRONT=[178,166,158], SIDE=[120,108,101];
function drawField(t){
  const lt=clamp(t-2,0,2), q=ease(clamp(lt/1.6,0,1));
  const camZ=lt*3.4, camX=0.3+lt*0.25, camH=7.5-4.6*q, P=1.45-1.12*q, f=760;   // starts top-down on the red lattice, then tilts to the horizon
  const cp=Math.cos(P), sp=Math.sin(P);
  const proj=(x,y,z)=>{const dx=x-camX,dy=y-camH,dz=z-camZ;const yv=dy*cp+dz*sp, zv=dz*cp-dy*sp;return zv<0.6?null:[640+f*dx/zv,360-f*yv/zv,zv];};
  const hy=360-f*Math.tan(P);
  const sky=g2.createLinearGradient(0,hy-420,0,hy); sky.addColorStop(0,'#4a1a10'); sky.addColorStop(1,'#E9682F');
  g2.fillStyle=sky; g2.fillRect(0,0,1280,720);
  const fl=g2.createLinearGradient(0,Math.max(hy,0),0,720); fl.addColorStop(0,'rgb(214,106,70)'); fl.addColorStop(0.25,'#cf3a20'); fl.addColorStop(1,'#d8341b');
  g2.fillStyle=fl; g2.fillRect(0,Math.max(hy,-10),1280,760);
  const list=[], z0=Math.floor(camZ)-6;
  for(let gz=z0+34; gz>=z0; gz--){
    const dz=gz-camZ, span=Math.ceil(dz*1.15+7);
    const xs=[]; for(let gx=Math.floor(camX)-span; gx<=Math.floor(camX)+span; gx++) xs.push(gx);
    xs.sort((a,b)=>Math.abs(b-camX)-Math.abs(a-camX));
    for(const gx of xs) list.push([gx,gz]);
  }
  const W=0.36;
  // soft floor shadows first (light from back-right, shadows fall toward camera-left)
  const SDX=-0.5, SDZ=-0.42;
  for(const [pass,ext,alpha,grow] of [[0,1.4,0.3,0.08],[1,0.95,0.62,0]]){
    for(const [gx,gz] of list){
      const hh=hash(gx*31.7+gz*7.3), h=0.25+1.5*hh*hh, fog=clamp(Math.pow((gz-camZ)/30,1.3),0,0.92);
      g2.beginPath(); let ok=true;
      for(let k=0;k<=5;k++){const o=h*ext*k/5, ox=SDX*o, oz=SDZ*o, ww=W+grow*k;
        const q=[proj(gx-ww+ox,0,gz-ww+oz),proj(gx+ww+ox,0,gz-ww+oz),proj(gx+ww+ox,0,gz+ww+oz),proj(gx-ww+ox,0,gz+ww+oz)];
        if(q.some(v=>!v)){ok=false;break;} q.forEach((v,i)=>i?g2.lineTo(v[0],v[1]):g2.moveTo(v[0],v[1])); g2.closePath();}
      if(!ok) continue; g2.fillStyle=`rgba(70,8,0,${(alpha*(1-fog)).toFixed(3)})`; g2.fill('nonzero');
    }
  }
  for(const [gx,gz] of list){
    const hh=hash(gx*31.7+gz*7.3), h=0.25+1.5*hh*hh;
    const x0=gx-W,x1=gx+W,zA=gz-W,zB=gz+W;
    const c=[proj(x0,0,zA),proj(x1,0,zA),proj(x1,h,zA),proj(x0,h,zA),proj(x0,0,zB),proj(x1,0,zB),proj(x1,h,zB),proj(x0,h,zB)];
    if(c.some(v=>!v)) continue;
    const fog=clamp(Math.pow((gz-camZ)/30,1.3),0,0.92);
    const poly=(ids,col)=>{g2.beginPath();ids.forEach((i,k)=>k?g2.lineTo(c[i][0],c[i][1]):g2.moveTo(c[i][0],c[i][1]));g2.closePath();g2.fillStyle=rgb(mix(col,FOG,fog));g2.fill();};
    if(gx>camX+W) poly([0,4,7,3],SIDE); else if(gx<camX-W) poly([1,5,6,2],SIDE);
    poly([0,1,2,3],FRONT);
    poly([3,2,6,7],TOP);
  }
}
// chrome metaball: two glossy spheres + neck (goo mask), red lattice reflection, speculars
const bl={m:0,s:0.2,y:0};
function lattice(x,y,r){ let s='';
  [0.08,0.26,0.44,0.6,0.74,0.86].forEach((f,i)=>{const yy=y+f*r, rx=r*Math.sqrt(1-f*f); s+=`<ellipse cx="${x.toFixed(1)}" cy="${yy.toFixed(1)}" rx="${rx.toFixed(1)}" ry="${(rx*0.2).toFixed(1)}" fill="none" stroke="${i%2?'#ffd2c2':'#ff3d1f'}" stroke-width="${(r*0.03).toFixed(1)}"/>`;});
  for(let k=-4;k<=4;k++){const e=k/4.6; s+=`<path d="M${(x+e*r).toFixed(1)} ${y.toFixed(1)} Q${(x+e*r*0.95).toFixed(1)} ${(y+r*0.6).toFixed(1)} ${(x+e*r*0.25).toFixed(1)} ${(y+r*0.97).toFixed(1)}" fill="none" stroke="#ff3d1f" stroke-width="${(r*0.028).toFixed(1)}"/>`;}
  return s; }
function spec(x,y,r){ return `<ellipse cx="${(x-r*0.32).toFixed(1)}" cy="${(y-r*0.56).toFixed(1)}" rx="${(r*0.36).toFixed(1)}" ry="${(r*0.12).toFixed(1)}" fill="#fff" transform="rotate(-24 ${(x-r*0.32).toFixed(1)} ${(y-r*0.56).toFixed(1)})"/>`+
  `<path d="M${(x-r*0.72).toFixed(1)} ${(y-r*0.12).toFixed(1)} Q${(x-r*0.6).toFixed(1)} ${(y+r*0.08).toFixed(1)} ${(x-r*0.35).toFixed(1)} ${(y+r*0.05).toFixed(1)}" stroke="#fff" stroke-width="${(r*0.05).toFixed(1)}" fill="none" stroke-linecap="round"/>`+
  `<rect x="${(x+r*0.55).toFixed(1)}" y="${(y-r*0.1).toFixed(1)}" width="${(r*0.06).toFixed(1)}" height="${(r*0.3).toFixed(1)}" rx="${(r*0.03).toFixed(1)}" fill="#fff" opacity=".85"/>`; }
function drawBlob(t){
  const R=135*bl.s, cy=330+bl.y, sep=bl.m*92*bl.s, w=Math.sin(t*2.4)*6*bl.m;

  $('#gooG').innerHTML=`<circle cx="${A[0]}" cy="${A[1]}" r="${A[2]}"/><circle cx="${Bb[0]}" cy="${Bb[1]}" r="${Bb[2]}"/>`+(bl.m>0.02?`<ellipse cx="640" cy="${cy-6*bl.m}" rx="${sep}" ry="${(R*0.62).toFixed(1)}"/>`:'');
  $('#shadeG').innerHTML=[A,Bb].map(([x,y,r])=>`<circle cx="${x}" cy="${y}" r="${r*1.02}" fill="url(#sph)"/>`).join('');
  // each sphere's reflection grid stops at the midline so the two grids never overlap in the neck
  const mid=((A[0]+Bb[0])/2).toFixed(1);
  $('#cAr').setAttribute('width',bl.m>0.02?mid:1280); $('#cBr').setAttribute('x',bl.m>0.02?mid:1280);
  $('#latA').innerHTML=lattice(...A); $('#latB').innerHTML=bl.m>0.02?lattice(...Bb):'';
  $('#spec').innerHTML=spec(...A)+spec(...Bb);
  $('#chrome').setAttribute('y1',(cy-R).toFixed(1)); $('#chrome').setAttribute('y2',(cy+R).toFixed(1));
  $('#bshadow').setAttribute('rx',(150*bl.s+sep).toFixed(1));
}

function drawSlots(t){
  for(const s of SLOTS){

    s.c.style.transform=`translateY(${(-s.target*e).toFixed(1)}px)`;

  }
}

}

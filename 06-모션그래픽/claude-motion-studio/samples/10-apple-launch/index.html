        <div style="overflow:hidden;height:30px"><div id="ld" style="font-size:20px;font-weight:600;opacity:.9">Sunday 27 September</div></div>
        <div style="overflow:hidden;height:124px"><div id="lt" style="font-size:118px;font-weight:700;letter-spacing:-.03em;line-height:124px">6:47</div></div>

    <div id="sk" style="position:absolute;left:0;top:9px;width:22px;height:22px;margin-left:-11px;border-radius:50%;background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.3)"></div>
  </div>

  <!-- 4. browser product page -->

      <div style="margin-left:24px;background:#FBFAF7;border-radius:8px 8px 0 0;height:34px;margin-top:10px;padding:0 18px;line-height:34px;font-size:13px;font-weight:600">Slowlife — Framed prints</div></div>

        <svg viewBox="300 250 420 600" preserveAspectRatio="xMidYMid slice" style="width:100%;height:100%;display:block"><use href="#land" width="940" height="940"/></svg></div></div>

  <!-- 6. end wordmark -->

<script src="../../lib/gsap.min.js"></script><script src="../../lib/stage.js"></script>
<script>
const tl = Motion.timeline();
const $ = s => document.querySelector(s);
const E='expo.inOut', EO='expo.out', P4='power4.out';
gsap.set('.win',{xPercent:-50,yPercent:-50});
/* procedural detail (seeded) */
const r=Motion.rand(10), NS='http://www.w3.org/2000/svg';
const mk=(tag,a,parent)=>{const e=document.createElementNS(NS,tag);for(const k in a)e.setAttribute(k,a[k]);parent.appendChild(e);return e;};
const town=$('#town'); for(let x=0;x<940;x+=14){const h=8+r()*22;mk('rect',{x,y:600-h,width:12,height:h,fill:['#E9E4DA','#D8CFC0','#C4B9A6','#F2EEE6','#B7A48C'][Math.floor(r()*5)]},town);}
const boats=$('#boats'); for(let i=0;i<34;i++){const x=r()*900,y=612+r()*26,w=20+r()*26;mk('rect',{x,y,width:w,height:6,rx:2,fill:i%11===3?'#C8352A':'#F4F2EC'},boats);mk('line',{x1:x+w/2,y1:y,x2:x+w/2,y2:y-26-r()*30,stroke:'#E8E6E0','stroke-width':1.2},boats);}
mk('rect',{x:760,y:618,width:90,height:14,rx:3,fill:'#C8352A'},boats);
const grain=$('#grain'); for(let i=0;i<46;i++){const y=i*21+r()*8;let d=`M0 ${y}`;for(let x=0;x<=940;x+=94)d+=` Q${x+47} ${y+(r()-.5)*18} ${x+94} ${y+(r()-.5)*6}`;mk('path',{d},grain);}
const lg=$('#lg'); for(let i=0;i<16;i++){const cx=60+r()*820,cy=40+r()*500,rot=r()*180;mk('ellipse',{cx,cy,rx:70+r()*40,ry:22+r()*10,transform:`rotate(${rot} ${cx} ${cy})`},lg);} mk('path',{d:'M0 0 C200 200 300 400 380 600',stroke:'#3a3a30','stroke-width':10,fill:'none'},lg);
/* wordmark helper: letters typeset under a mask */
function word(id){const w=$(id);w.innerHTML=[...'Slowlife.'].map(c=>`<span class="m"><span>${c}</span></span>`).join('');return [...w.querySelectorAll('.m')];}
const L1=word('#wm1'), L2=word('#wm2');
const cardBox=()=>$('#card').getBoundingClientRect();

/* 0–1.0 blinking caret, 1.0–1.8 typeset */
gsap.set(L1,{visibility:'hidden'});
[0.25,0.75,2.0].forEach(t=>tl.set('#caret',{opacity:0},t)); [0.5,1.0].forEach(t=>tl.set('#caret',{opacity:1},t));
const ty={n:0};
tl.to(ty,{n:9,duration:0.81,ease:'none',onUpdate(){
  const k=Math.floor(ty.n+1e-6); L1.forEach((m,i)=>m.style.visibility=i<k?'visible':'hidden');
  const cb=cardBox(); if(k>0){const b=L1[k-1].getBoundingClientRect(); $('#caret').style.left=(b.right-cb.left+6)+'px';}
  else {$('#caret').style.left=(L1[0].getBoundingClientRect().left-cb.left)+'px';}
}},1.0);
L1.forEach((m,i)=>tl.fromTo(m.firstChild,{yPercent:60},{yPercent:0,duration:0.3,ease:EO},1.0+i*0.09));
tl.to('#caret',{scaleY:0,duration:0.2,ease:'power3.in'},2.2);
/* 2.4 push wordmark up, coffee circle opens */
tl.to(L1.map(m=>m.firstChild),{yPercent:-110,duration:0.4,ease:'power4.in',stagger:0.02},2.35);
tl.fromTo('#wCup',{width:0,height:0,borderRadius:'50%'},{width:340,height:340,duration:0.7,ease:EO},2.72);
tl.fromTo('#iCup',{scale:1.25},{scale:1,duration:1.2,ease:EO},2.72);
tl.to('#wCup',{width:360,height:360,borderRadius:28,duration:0.55,ease:E},3.35);
/* 4.0 push: coffee out left, landscape tile in from right, then expands to full card */
tl.to('#wCup',{x:-680,duration:0.6,ease:E},4.0);
tl.fromTo('#wLand',{x:680,width:360,height:360,borderRadius:28},{x:0,duration:0.6,ease:E},4.0);
tl.to('#wLand',{width:940,height:940,borderRadius:0,duration:0.7,ease:E},4.55);
tl.fromTo('#iLand',{scale:1.15},{scale:1,duration:3.2,ease:'power2.out'},4.0);
[['#pxCl',-34],['#pxFar',-14],['#pxMid',-7],['#pxNear',-3]].forEach(([id,dx])=>tl.fromTo(id,{x:0},{x:dx,duration:3.0,ease:'sine.inOut'},4.0));
/* 5.2 scrub overlay */
gsap.set('#scrub',{y:120}); tl.set('#split',{visibility:'hidden'},0); tl.set('#split',{visibility:'visible'},5.25);
tl.to('#scrub',{y:0,duration:0.45,ease:P4},5.2);
const sc={v:0.04};
const setSc=()=>{const x=780*sc.v;$('#sf').style.transform=`scaleX(${sc.v})`;$('#sk').style.left=x+'px';
  const px=80+x;$('#split').style.transform=`translateX(${px}px)`;$('#grade').style.clipPath=`inset(0 ${940-px}px 0 0)`;};
tl.to(sc,{v:0.04,duration:0.01,onUpdate:setSc},5.2);
tl.set('#cur',{x:980,y:980},0);
tl.to('#cur',{x:80+780*0.04,y:880,duration:0.5,ease:'power3.inOut'},5.0);
tl.to('#cur',{scale:0.82,duration:0.08},5.55);
tl.to(sc,{v:0.86,duration:1.0,ease:'power3.inOut',onUpdate:setSc},5.6);
tl.to('#cur',{x:80+780*0.86,duration:1.0,ease:'power3.inOut'},5.6);
tl.to('#cur',{scale:1,duration:0.15},6.6);
/* 6.7 overlay drops, landscape morphs into phone screen */
tl.to('#scrub',{y:140,duration:0.4,ease:'power4.in'},6.7);
tl.set('#split',{visibility:'hidden'},6.7);
tl.to('#cur',{x:860,y:960,duration:0.5,ease:'power3.in'},6.7);
tl.to('#wLand',{width:330,height:700,borderRadius:52,duration:0.8,ease:E},6.9);
tl.to('#wLand',{boxShadow:'0 0 0 11px #111, 0 30px 60px rgba(0,0,0,.25)',duration:0.3,ease:EO},7.55);
tl.to('#island',{scale:1,duration:0.35,ease:'back.out(2)'},7.6);
gsap.set(['#ld','#lt'],{yPercent:110});
tl.to('#ld',{yPercent:0,duration:0.5,ease:P4},7.75); tl.to('#lt',{yPercent:0,duration:0.6,ease:P4},7.85);
/* 8.6 push: phone left, browser in from right; 9.2 phone out, browser centres */
gsap.set('#br',{x:900});

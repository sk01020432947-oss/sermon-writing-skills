      <div class="row" style="position:absolute;left:28px;top:224px;width:524px;height:36px;display:flex;align-items:center;gap:16px;font-size:21px;font-weight:600;color:#b6b2ab">
        <span style="width:36px;height:36px;border-radius:9px;background:#E4E0D9;display:inline-block"></span>Show lyrics</div>

    <!-- 9 chart card -->

      <div style="position:absolute;left:24px;top:22px;width:300px;height:48px;border-radius:24px;background:#F2EFEA">
        <div style="position:absolute;left:104px;top:4px;width:92px;height:40px;border-radius:20px;background:#111"></div>

      <div style="position:absolute;right:24px;top:26px;width:40px;height:40px;border-radius:50%;background:#F2EFEA"><svg width="40" height="40" viewBox="0 0 40 40"><circle cx="18" cy="18" r="6.5" stroke="#111" stroke-width="2.2" fill="none"/><path d="M23 23l5 5" stroke="#111" stroke-width="2.2" stroke-linecap="round"/></svg></div>

<script src="../../lib/gsap.min.js"></script><script src="../../lib/stage.js"></script>
<script>
const tl = Motion.timeline();
const $ = s => document.querySelector(s), el = $('#el');
gsap.set(el,{xPercent:-50,yPercent:-50});
const SPRING='back.out(1.5)';
let cur='#L0';
tl.set('#L0',{opacity:1},0);
// 한 요소가 모양·색·내용을 바꾼다 (짧은 블러 동반)
function morph(t, box, layer, dur=0.5){
  tl.to(el,Object.assign({duration:dur,ease:SPRING},box),t);
  tl.to(el,{filter:'blur(5px)',duration:0.09,ease:'power1.in'},t);
  tl.to(el,{filter:'blur(0px)',duration:0.2,ease:'power1.out'},t+0.09);
  tl.to(cur,{opacity:0,scale:0.9,duration:0.1},t);
  tl.fromTo(layer,{opacity:0,scale:0.9},{opacity:1,scale:1,duration:0.35,ease:'back.out(2)'},t+0.14);
  cur=layer;
}
function press(t){
  tl.to(el,{scale:0.94,duration:0.08,ease:'power2.out'},t).to(el,{scale:1,duration:0.35,ease:'back.out(3)'},t+0.08);
}
const C=$('#cur');
function mv(t,x,y,d=0.45,ease='power3.inOut'){ tl.to(C,{x,y,duration:d,ease},t); }
function click(t){ tl.to(C,{scale:0.82,duration:0.07},t).to(C,{scale:1,duration:0.2,ease:'back.out(3)'},t+0.08); }
const WHITE_SH='0 14px 34px rgba(0,0,0,.13), 0 2px 6px rgba(0,0,0,.06)', DARK_SH='0 18px 40px rgba(0,0,0,.28), 0 2px 6px rgba(0,0,0,.1)';

tl.set(C,{x:860,y:900},0);
/* 0.0 button → click */
tl.from(el,{scale:0.6,opacity:0,duration:0.5,ease:SPRING},0);
mv(0.15,566,552,0.8,'power3.out');
click(1.0); press(1.0);
/* 1.25 loader */
morph(1.25,{width:96,height:96,borderRadius:48,backgroundColor:'#111',boxShadow:DARK_SH},'#L1');
mv(1.4,690,650,0.6);
tl.fromTo('#spin',{rotation:0,svgOrigin:'48 48'},{rotation:540,svgOrigin:'48 48',duration:1.0,ease:'none'},1.25);
/* 2.25 success */
morph(2.25,{width:130,height:130,borderRadius:65,backgroundColor:'#2DB55D'},'#L2');
tl.to('#chk',{strokeDashoffset:0,duration:0.35,ease:'power2.out'},2.4);
tl.to(el,{scale:1.06,duration:0.12,yoyo:true,repeat:1},2.75);
/* 3.1 connected pill (원본: 체크 → Connected 알약) */
morph(3.1,{width:320,height:72,borderRadius:36,backgroundColor:'#0E0E0F'},'#L10');
tl.fromTo('#cdots i',{y:0},{y:-5,duration:0.16,yoyo:true,repeat:3,stagger:0.07,ease:'sine.inOut'},3.35);
/* 3.75 music player (dynamic island) */
morph(3.75,{width:560,height:150,borderRadius:40,backgroundColor:'#0E0E0F'},'#L3',0.55);
const TOTAL=188, pos={s:72};
const fmt=s=>{s=Math.round(s);return Math.floor(s/60)+':'+String(s%60).padStart(2,'0');};
const setPos=()=>{const f=pos.s/TOTAL;$('#pf').style.transform=`scaleX(${f})`;$('#pk').style.left=(80+390*f)+'px';$('#tA').textContent=fmt(pos.s);$('#tB').textContent='-'+fmt(TOTAL-pos.s);};
tl.to(pos,{s:73.2,duration:1.2,ease:'none',onUpdate:setPos},3.75);
const eq={p:0}; const EB=[...document.querySelectorAll('.eb')];
tl.to(eq,{p:1,duration:2.8,ease:'none',onUpdate(){EB.forEach((b,i)=>{const h=8+22*Math.abs(Math.sin(eq.p*38+i*1.7));b.setAttribute('y',30-h);b.setAttribute('height',h);});}},3.75);
const knobX=80+390*(73.2/TOTAL), elL=540-280, elT=540-75;
mv(4.6,elL+knobX,elT+117,0.45);
tl.to('#pk',{scale:1,duration:0.2,ease:'back.out(3)'},4.95);
click(5.1); tl.to('#pk',{scale:1.35,duration:0.15},5.1);
mv(5.15,elL+80+390*0.75,elT+117,0.8,'power2.inOut');
tl.to(pos,{s:TOTAL*0.75,duration:0.8,ease:'power2.inOut',onUpdate:setPos},5.15);
tl.to('#pk',{scale:1,duration:0.15},6.0);
/* 6.2 → volume slider (커서를 쥔 채 이어서) */
morph(6.2,{width:460,height:72,borderRadius:36,backgroundColor:'#ffffff',boxShadow:WHITE_SH},'#L4');
const vol={v:(elL+80+390*0.75-(540-230)-70)/320, o:0};
const setVol=()=>{const o=vol.o;
  $('#vf').style.width=$('#vt').style.width=(320+o)+'px'; $('#vf').style.transform=`scaleX(${vol.v})`;
  $('#vk').style.left=(70+(320+o)*vol.v)+'px';
  $('#L4').style.width=(460+o)+'px'; $('#L4').style.marginLeft=(-230-o/2)+'px';};
const setStr=()=>{setVol(); el.style.width=(460+vol.o)+'px'; gsap.set(el,{x:vol.o/2});};
const vx=v=>540-230+70+320*v;
tl.to(vol,{v:vol.v,duration:0.01,onUpdate:setVol},6.2);
tl.to(vol,{v:0.3,duration:0.45,ease:'power2.inOut',onUpdate:setVol},6.5); mv(6.5,vx(0.3),548,0.45,'power2.inOut');
tl.to(vol,{v:1,duration:0.45,ease:'power2.in',onUpdate:setVol},6.95); mv(6.95,vx(1),548,0.45,'power2.in');
/* 최대치를 넘겨 끌면 트랙 전체가 고무줄처럼 늘어난다(저항 0.45) */
mv(7.4,vx(1)+90,548,0.4,'power2.out');
tl.to(vol,{o:40,duration:0.4,ease:'power2.out',onUpdate:setStr},7.4);
tl.to('#vk',{scaleX:1.25,scaleY:0.85,duration:0.3},7.4);
/* 놓으면 스프링으로 복귀 */
click(7.95);
tl.to(vol,{o:0,duration:0.6,ease:'elastic.out(1,0.35)',onUpdate:setStr},8.0);
tl.to('#vk',{scaleX:1,scaleY:1,duration:0.5,ease:'elastic.out(1,0.4)'},8.0);
mv(8.05,575,560,0.4,'power3.out');
/* 8.6 toggle */
morph(8.6,{width:176,height:96,borderRadius:48,backgroundColor:'#CFCBC4',boxShadow:WHITE_SH},'#L6');
click(9.05);
tl.to('#knob',{x:80,duration:0.4,ease:'back.out(1.8)'},9.05);
tl.to('#knob',{width:96,duration:0.12,ease:'power2.out'},9.05).to('#knob',{width:76,duration:0.3,ease:'back.out(2)'},9.17);
tl.to(el,{backgroundColor:'#F2552C',duration:0.25,ease:'power2.out'},9.05);
/* 9.6 tabs — 표시자의 두 모서리가 서로 다른 스프링(앞쪽 빠르게, 뒤쪽 늦게) */
morph(9.6,{width:480,height:80,borderRadius:40,backgroundColor:'#ffffff'},'#L5');
const TABS=[...document.querySelectorAll('.tab')];
const setTab=(i,t)=>TABS.forEach((x,k)=>tl.set(x,{color:k===i?'#fff':'#8d8a85'},t));
setTab(0,9.6);
const ind={l:10,r:158}; const setInd=()=>{const I=$('#ind');I.style.left=ind.l+'px';I.style.width=(ind.r-ind.l)+'px';};
function slide(t,l,r){ // 진행 방향 앞 모서리: 빠르고 오버슛 / 뒤 모서리: 80ms 늦게, 느슨한 스프링

<script>
const B = 0.5; // 1 beat @120BPM
const $ = s => document.querySelector(s);
// [start, id, label, hudColor] — every start sits on the 0.25s (eighth-note) grid
const CH = [
  [0,'c1','01 / EASE','#fff'],[2,'c2','02 / TYPE','#0b0b0c'],[3.5,'c3','03 / SHAPE','#fff'],[5.5,'c4','04 / SPACE','#fff'],
  [7.5,'c5','05 / FLOW','#fff'],[9.5,'c6','06 / DATA','#0b0b0c'],[11,'c10','07 / MOTION','#0b0b0c'],[11.25,'c11','08 / FORM','#0b0b0c'],
  [11.5,'c7','09 / DESIGN','#fff'],[12,'c12','10 / 3D','#fff'],[12.25,'c13','11 / TYPE','#0b0b0c'],[12.5,'c14','12 / CODE','#fff'],
  [13,'c15','13 / SOUND','#0b0b0c'],[13.5,'c9','','#fff']];
const NSEG = CH.length - 1;
const segs = $('#segs'); for(let i=0;i<NSEG;i++) segs.appendChild(document.createElement('i'));
const hash=n=>{n=Math.sin(n*127.1)*43758.5453;return n-Math.floor(n);};
const smooth=x=>{x=Math.max(0,Math.min(1,x));return x*x*(3-2*x);};

document.fonts.load('900 200px Pretendard').then(()=>{
const tl = Motion.timeline();

/* ---------- 01 EASE ---------- */
const bez = (u,a,b,c,d)=>{const v=1-u;return v*v*v*a+3*v*v*u*b+3*v*u*u*c+u*u*u*d;};
tl.to('#curve',{strokeDashoffset:0,duration:0.8,ease:'power2.inOut'},0.1);
tl.from('#h1,#h2',{attr:{x2:(i)=>i?940:340,y2:(i)=>i?160:560},duration:0.5,ease:'expo.out'},0.3);
tl.from('#hp1,#hp2',{attr:{r:0},duration:0.4,ease:'back.out(3)'},0.42);   // handles lag the lines by 120ms
tl.from('#lbl',{x:-40,opacity:0,duration:0.4,ease:'expo.out'},0.5);
tl.set('#vline',{opacity:1},0.95);
const e1={u:0};
tl.to(e1,{u:1,duration:1.0,ease:'none',onUpdate(){
  const u=e1.u, x=bez(u,340,838,442,940), y=bez(u,560,560,160,160);
  $('#dot').setAttribute('cx',x); $('#dot').setAttribute('cy',y);
  $('#vline').setAttribute('x1',x); $('#vline').setAttribute('x2',x);
  const v=(560-y)/400; $('#mfill').style.transform=`scaleY(${v})`; $('#mval').textContent=v.toFixed(3);
  $('#mval').setAttribute('y',560-v*400+5);
}},0.95);

/* ---------- 02 TYPE ---------- */
[['#wI',2.0],['#wM',2.15],['#wT',2.35],['#wV',2.6]].forEach(([s,t])=>{
  tl.fromTo(s,{scale:2.2,opacity:0,y:-30},{scale:1,opacity:1,y:0,duration:0.3,ease:'expo.out',transformOrigin:'50% 60%'},t);
});
tl.to('#c2 .ln',{x:(i)=>[-6,8,-4][i],duration:0.05,yoyo:true,repeat:3,ease:'none'},2.65);
tl.to('#disc',{scale:1,duration:0.22,ease:'back.out(2)'},2.9);
// zoom through the O: transform origin = disc centre
const oo=$('#oo'), l3=$('#l3');
const ox=l3.offsetLeft+oo.offsetLeft+oo.offsetWidth/2, oy=l3.offsetTop+oo.offsetTop+oo.offsetHeight*0.52;
tl.fromTo('#tz',{scale:1},{scale:16,duration:0.38,ease:'expo.in',transformOrigin:`${ox}px ${oy}px`,immediateRender:false},3.12);

/* ---------- 03 SHAPE ---------- */
const SH = {
  star:'M26 3 L32.5 19 L49 19.5 L36 30 L41 47 L26 37 L11 47 L16 30 L3 19.5 L19.5 19 Z',
  circle:'M26 4 A22 22 0 1 1 25.9 4 Z', square:'M6 6 H46 V46 H6 Z', diamond:'M26 3 L49 26 L26 49 L3 26 Z',
  tri:'M10 5 L48 26 L10 47 Z', cross:'M19 4 H33 V19 H48 V33 H33 V48 H19 V33 H4 V19 H19 Z'};
const KEYS=Object.keys(SH), COLS=['#F2552C','#3B5BFF','#F3E9D2','#F7D046','#ffffff'];
const r3=Motion.rand(3), cellsEl=$('#cells'), cells=[];
const NC=13, NR=7, GX=86, GY=82, OX=(1280-(NC-1)*GX)/2-26, OY=(720-(NR-1)*GY)/2-26;
for(let r=0;r<NR;r++)for(let c=0;c<NC;c++){
  const d=document.createElement('div'); d.className='cell'; d.style.left=(OX+c*GX)+'px'; d.style.top=(OY+r*GY)+'px';
  const k1=KEYS[(r+c*2)%6], k2=KEYS[Math.floor(r3()*6)], c1=COLS[(r*3+c)%5], c2=COLS[Math.floor(r3()*5)];
  d.innerHTML=`<svg viewBox="0 0 52 52" class="a"><path d="${SH[k1]}" fill="${c1}"/></svg><svg viewBox="0 0 52 52" class="b" style="opacity:0"><path d="${SH[k2]}" fill="${c2}"/></svg>`;
  cellsEl.appendChild(d); cells.push({d,dist:Math.hypot(c-(NC-1)/2,(r-(NR-1)/2)*1.1),dx:640-(OX+c*GX+26),dy:360-(OY+r*GY+26)});
}
cells.forEach(({d,dist,dx,dy})=>{
  const t0=3.5+dist*0.04;
  tl.fromTo(d,{scale:0,rotation:-90},{scale:1,rotation:0,duration:0.42,ease:'back.out(2.2)'},t0);
  const t1=4.35+dist*0.06; // ripple + morph
  tl.to(d,{scale:0.25,rotation:90,duration:0.16,ease:'power2.in'},t1);
  tl.set(d.querySelector('.a'),{opacity:0},t1+0.16); tl.set(d.querySelector('.b'),{opacity:1},t1+0.16);
  tl.to(d,{scale:1,rotation:180,duration:0.28,ease:'back.out(3)'},t1+0.16);
  // collapse: everything is sucked into the centre, outer cells first
  tl.to(d,{x:dx,y:dy,scale:0,duration:0.32,ease:'power3.in'},5.08-dist*0.012);
});
tl.to('#core',{scale:1,duration:0.3,ease:'expo.out'},5.22);

/* ---------- 04 SPACE: flat disc -> lit sphere -> tilted torus ---------- */
const ringSVG=`<svg viewBox="-350 -250 700 500"><defs><path id="RP" d="M-300 0 A300 300 0 1 1 300 0 A300 300 0 1 1 -300 0"/></defs>
<g class="spin"><text font-family="Pretendard" font-weight="800" font-size="30" letter-spacing="12" fill="#f4e9dc"><textPath href="#RP">MOTION DESIGN — LIGHT — SPACE — DEPTH — MOTION DESIGN — LIGHT — SPACE — DEPTH —</textPath></text></g></svg>`;
$('#ringB').innerHTML=ringSVG; $('#ringF').innerHTML=ringSVG.replace('RP','RP2').replace('#RP','#RP2');
tl.to('#shade',{opacity:1,duration:0.35,ease:'power2.out'},5.6);
tl.to('#spec',{opacity:1,duration:0.3},5.7);
tl.to('#rim,#glow',{opacity:1,duration:0.4},5.75);
tl.fromTo('#spec',{x:-60,y:-70},{x:-20,y:-60,duration:1.9,ease:'sine.inOut'},5.6);
tl.fromTo('.ring .spin',{rotation:0,svgOrigin:'0 0'},{rotation:-150,svgOrigin:'0 0',duration:2,ease:'none'},5.5);
tl.fromTo('.ringwrap',{scale:0.6,opacity:0},{scale:1,opacity:1,duration:0.6,ease:'expo.out'},5.7);
tl.to('#blob',{borderRadius:'58% 42% 37% 63%/55% 60% 40% 45%',rotation:30,duration:0.6,ease:'sine.inOut'},6.0);
tl.to('#blob',{borderRadius:'50%',rotation:0,duration:0.35,ease:'power2.out'},6.6);

/* ---------- 05 FLOW (canvas): swirl -> particles spell FLOW -> collapse to a glowing line ---------- */
const cv=$('#cv'), cx=cv.getContext('2d'), r5=Motion.rand(5), P=[];
const tc=document.createElement('canvas'); tc.width=1280; tc.height=720; const tx=tc.getContext('2d');
tx.fillStyle='#fff'; tx.font='900 300px Pretendard'; tx.textAlign='center'; tx.textBaseline='middle'; tx.fillText('FLOW',640,372);
const td=tx.getImageData(0,0,1280,720).data, PTS=[];
for(let y=0;y<720;y+=3)for(let x=0;x<1280;x+=3) if(td[(y*1280+x)*4+3]>128) PTS.push([x,y]);
const NP=4200;
for(let i=0;i<NP;i++){const tp=PTS[Math.floor(i*PTS.length/NP)];
  P.push({r:110+Math.pow(r5(),0.6)*400, a:r5()*Math.PI*2, s:0.6+r5()*0.8, z:0.6+r5()*1.5, h:r5(), tx:tp[0]+(r5()-0.5)*3, ty:tp[1]+(r5()-0.5)*3});}
function drawFlow(t){
  const lt=t-7.5; cx.globalCompositeOperation='source-over'; cx.fillStyle='#060607'; cx.fillRect(0,0,1280,720);
  cx.globalCompositeOperation='lighter';
  const burst=1-Math.pow(1-Math.min(1,lt/0.7),3);
  const form=smooth((lt-0.75)/0.6), line=smooth((lt-1.6)/0.3);
  for(const p of P){
    const trail = form<0.9 ? 2 : 1;
    for(let k=0;k<trail;k++){
      const tt=lt-k*0.05, w=p.s*(160/p.r)*1.6;
      const a=p.a+w*tt, rr=p.r*(0.25+0.75*burst)*(1-0.12*Math.sin(tt*2+p.h*6));
      let x=640+Math.cos(a)*rr*1.25, y=360+Math.sin(a)*rr*0.72;
      const f=Math.max(0,form-k*0.08); x+= (p.tx-x)*f; y+= (p.ty-y)*f;
      if(line>0){ x=x+((200+(p.tx-180)*0.95)-x)*line; y=y+(360+(p.h-0.5)*6-y)*line; }
      cx.fillStyle = k? 'rgba(242,85,44,0.45)' : (p.h<0.16?'rgba(120,150,255,0.85)':`rgba(255,${190+Math.floor(p.h*60)},${150+Math.floor(p.h*80)},0.85)`);
      cx.beginPath(); cx.arc(x,y,p.z*(k?1.5:1)*(1+0.5*form)*(1-0.5*line),0,6.283); cx.fill();
    }
  }
  if(line>0.3){ // glow line takes over
    cx.globalCompositeOperation='source-over'; cx.shadowColor='#F2552C'; cx.shadowBlur=26*line;
    cx.strokeStyle=`rgba(255,214,184,${(line-0.3)/0.7})`; cx.lineWidth=5; cx.lineCap='round';
    cx.beginPath(); cx.moveTo(200,360); for(let x=200;x<=1080;x+=10) cx.lineTo(x,360+Math.sin(x*0.05+lt*30)*3*line); cx.stroke(); cx.shadowBlur=0;
  }
}

/* ---------- 09 DESIGN glitch rows ---------- */

  grows.appendChild(row); GROWS.push(row);
}
function drawGlitch(t){
  const lt=t-11.5, f=Math.floor(t*15);
  GROWS.forEach((row,i)=>{
    const base=(i%2?-1:1)*lt*300 - (i%2?0:300);
    const jump=hash(f+i*7)>0.7?(hash(f*3+i)-0.5)*120:0;
    row.style.transform=`translateX(${base+jump}px)`;
    [...row.children].forEach((s,k)=>{const o=(k-1)*(6+hash(f+i+k*13)*18); s.style.transform=`translate(${o}px,${(k-1)*hash(f+k)*4}px)`;});
  });
}

const sb=$('#sbars'); for(let i=0;i<150;i++) sb.insertAdjacentHTML('beforeend',`<rect x="${130+i*6.8}" width="3.6" y="360" height="0"/>`);

/* ---------- master clock: chapters, HUD, canvas ---------- */

tl.to(clk,{t:16,duration:16,ease:'none',onUpdate(){
  const t=clk.t; let ci=0; CH.forEach((c,i)=>{if(t>=c[0]-1e-6)ci=i;});
  CH.forEach((c,i)=>{document.getElementById(c[1]).style.visibility=i===ci?'visible':'hidden';});
  const hud=$('#hud'); hud.style.color=CH[ci][3]; hud.style.visibility=ci===NSEG?'hidden':'visible';
  $('#hTL').textContent=CH[ci][2];
  const fr=Math.floor(t*30), s=Math.floor(fr/30), ff=fr%30;
  $('#hBL').textContent=`00:00:${String(s).padStart(2,'0')}:${String(ff).padStart(2,'0')}`;
  $('#hBR').innerHTML=`120 BPM&nbsp;&nbsp;${Math.floor(t/2)+1}.${Math.floor(t/B)%4+1}`;
  [...segs.children].forEach((e,i)=>e.className=i<=ci?'on':'');
  const id=CH[ci][1];
  if(id==='c5') drawFlow(t); if(id==='c7') drawGlitch(t); if(id==='c15') drawSound(t);
  if(id==='c11'){const f=Math.floor(t*30); document.querySelectorAll('#forms .fm').forEach((g,i)=>{const o=4+hash(f+i)*10;
    g.querySelector('.fr').setAttribute('transform',`translate(${o/3} 0)`); g.querySelector('.fc').setAttribute('transform',`translate(${-o/3} ${(hash(f*2+i)-0.5)*2})`);});}
  if(id==='c14') $('#cur').style.opacity=Math.floor(t*8)%2?0.2:1;
}},0);

<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><title>설교 시리즈 인트로 · Sermon Series Intro</title>
<link rel="stylesheet" href="../../lib/stage.css">
<style>
  .frame{background:#121212 !important;background-image:none !important}
  .scene{position:absolute;inset:0;overflow:hidden;color:#EFE8DA}
  :root{--cream:#EFE8DA;--gold:#C9A24A;--dim:rgba(239,232,218,.42);
        --serifK:"Noto Serif KR","NanumMyeongjo","Nanum Myeongjo","AppleMyungjo",serif}
  .bg,.warm,.grain,.vig{position:absolute;inset:0}
  .bg{background:#121212}
  .warm{background:radial-gradient(ellipse 70% 60% at 50% 46%,#241d14 0%,#17130f 55%,#0e0c0a 100%);opacity:0}
  .grain{opacity:.07;mix-blend-mode:screen;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/></filter><rect width='200' height='200' filter='url(%23n)'/></svg>")}
  .vig{background:radial-gradient(ellipse 85% 80% at 50% 50%,transparent 55%,rgba(0,0,0,.55) 100%)}
  /* HUD (terminal 흔적) */
  .hud{position:absolute;font-family:var(--mono);font-size:11px;letter-spacing:.12em;color:var(--dim)}
  .hud.tl{left:40px;top:28px}.hud.tr{right:40px;top:28px;display:flex;gap:14px;align-items:center}
  .hud.bl{left:40px;bottom:26px;color:rgba(239,232,218,.5)}.hud.br{right:40px;bottom:26px}
  .dots{display:flex;gap:5px}.dots i{width:7px;height:7px;background:rgba(239,232,218,.16);display:block}
  .dots i.on{background:var(--gold)}
  .gut{position:absolute;left:84px;top:212px;font-family:var(--mono);font-size:11px;line-height:44px;color:rgba(239,232,218,.13);letter-spacing:.1em}
  /* S1 나는 / 믿습니다 */
  .s1{position:absolute;left:136px;top:196px}
  .s1 .ln{font-family:var(--serifK);font-weight:800;line-height:1.08;white-space:nowrap;overflow:hidden}
  .s1 .a{font-size:92px;color:var(--dim)}
  .s1 .b{font-size:176px;letter-spacing:-.02em;margin-top:4px}
  .s1 .ch{display:none}
  .cur{display:inline-block;width:.42em;height:.78em;background:var(--gold);vertical-align:-.04em;margin-left:.08em}
  /* S2 큰 단어 */
  .word{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
  .word .win{overflow:hidden;padding:0 20px}
  .word .w{display:block;font-family:var(--serifK);font-weight:800;font-size:200px;line-height:1.12;letter-spacing:-.03em;white-space:nowrap}
  .word .k{font-family:var(--mono);font-size:12px;letter-spacing:.32em;color:var(--gold);margin-bottom:18px;opacity:0}
  .word.gold .w{color:var(--gold)}
  .stack{position:absolute;left:40px;top:96px;font-family:var(--mono);font-size:12px;line-height:22px;letter-spacing:.14em;color:rgba(239,232,218,.38)}
  .stack div{opacity:0}
  .stack b{color:var(--gold);font-weight:400;margin-right:10px}
  .uline{position:absolute;left:50%;top:500px;width:420px;height:2px;margin-left:-210px;background:var(--gold);transform:scaleX(0)}
  /* S3 십자가 */
  .cross{position:absolute;left:640px;top:262px;width:0;height:0}
  .cross .h{position:absolute;left:-460px;top:-1px;width:920px;height:2px;background:var(--gold);transform:scaleX(0)}
  .cross .v{position:absolute;left:-1px;top:-104px;width:2px;height:300px;background:var(--gold);transform:scaleY(0);transform-origin:50% 0}
  .glow{position:absolute;left:-160px;top:-160px;width:320px;height:320px;border-radius:50%;background:radial-gradient(circle,rgba(201,162,74,.22),transparent 65%);opacity:0}
  .vref{position:absolute;left:0;right:0;top:488px;text-align:center}
  .vref .q{font-family:var(--serifK);font-weight:700;font-size:34px;letter-spacing:-.01em;opacity:0}
  .vref .r{margin-top:16px;font-family:var(--mono);font-size:13px;letter-spacing:.36em;color:var(--gold);opacity:0}
  /* S4 타이틀 */
  .title{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding-top:40px}
  .title .ser{font-family:var(--sans);font-weight:600;font-size:15px;letter-spacing:.6em;color:var(--gold);padding-left:.6em;opacity:0}
  .title .win{overflow:hidden;margin-top:18px}
  .title .main{display:block;font-family:var(--serifK);font-weight:800;font-size:124px;letter-spacing:-.03em;line-height:1.15}
  .title .rule{width:64px;height:2px;background:var(--gold);margin:26px 0 22px;transform:scaleX(0)}
  .title .sub{font-family:var(--sans);font-weight:500;font-size:28px;letter-spacing:.02em;opacity:0}
  .title .txt{margin-top:14px;font-family:var(--mono);font-size:12px;letter-spacing:.3em;color:var(--dim);opacity:0}
</style></head>
<body data-no="S12" data-cat="설교 · SERMON" data-ko="설교 시리즈 인트로" data-en="Sermon Series Intro" data-meta="72BPM 키네틱 타이포 · 사도신경" data-dur="14" data-size="1280x720" data-poster="13.5">
<main class="scene">
  <div class="bg"></div><div class="warm"></div>
  <div class="hud tl">~/sermon/apostles-creed &nbsp;(제3강)</div>
  <div class="hud tr"><span>72 BPM</span><span>BAR <b id="bar" style="font-weight:400;color:#EFE8DA">01.1</b></span><span class="dots"><i></i><i></i><i></i><i></i></span></div>
  <div class="hud bl">&gt; <span id="log">creed.open()</span></div>
  <div class="hud br">고린도전서 15:1-11</div>

  <div class="gut" id="gut">01<br>02<br>03<br>04<br>05<br>06</div>
  <div class="s1" id="s1">
    <div class="ln a" id="la"><span class="ch">나</span><span class="ch">는</span><span class="cur" id="c1"></span></div>
    <div class="ln b" id="lb"><span class="ch">믿</span><span class="ch">습</span><span class="ch">니</span><span class="ch">다</span><span class="cur" id="c2" style="display:none"></span></div>
  </div>

  <div class="stack" id="stack"><div><b>01</b>전능하신</div><div><b>02</b>창조주</div><div><b>03</b>십자가</div><div><b>04</b>장사</div></div>
  <div class="word" id="w0"><div class="k">01 · 전능하신 아버지</div><div class="win"><span class="w">전능하신</span></div></div>
  <div class="word" id="w1"><div class="k">02 · 천지의 창조주</div><div class="win"><span class="w">창조주</span></div></div>
  <div class="word" id="w2"><div class="k">03 · 본디오 빌라도에게</div><div class="win"><span class="w">십자가</span></div></div>
  <div class="word" id="w3"><div class="k">04 · 죽으시고</div><div class="win"><span class="w">장사</span></div></div>
  <div class="word gold" id="w4"><div class="k">05 · 사흘 만에</div><div class="win"><span class="w">다시 살아나</span></div></div>
  <div class="uline" id="ul"></div>

  <div class="cross" id="cross"><div class="glow"></div><div class="h"></div><div class="v"></div></div>
  <div class="vref" id="vref"><div class="q">성경대로 사흘 만에 다시 살아나사</div><div class="r">고린도전서 15:3–4</div></div>

  <div class="title" id="title">
    <div class="ser">사도신경 강해</div>
    <div class="win"><span class="main">나는 믿습니다</span></div>
    <div class="rule"></div>
    <div class="sub">제3강 · 다시 살아나사</div>
    <div class="txt">고린도전서 15:1–11</div>
  </div>
  <div class="grain"></div><div class="vig"></div>
</main>
<script src="../../lib/gsap.min.js"></script><script src="../../lib/stage.js"></script>
<script>
const B = 60/72;               // 1박 = 0.8333s
const b = n => +(n*B).toFixed(4);
const tl = Motion.timeline();
const $ = s => document.querySelector(s);

// HUD: 박자 카운터 · 로그 (타임라인 onUpdate로 결정론)
const dots = [...document.querySelectorAll('.dots i')];
const logs = [[0,'creed.open()'],[b(2),'confess("나는 믿습니다")'],[b(4),'stack.push(전능하신)'],[b(5),'stack.push(창조주)'],[b(6),'stack.push(십자가)'],[b(7),'stack.push(장사)'],[b(8),'rise("다시 살아나")'],[b(10),'draw(cross)'],[b(13),'title.hold(2s)']];
const clk = {t:0};
tl.to(clk,{t:Motion.dur,duration:Motion.dur,ease:'none',onUpdate(){
  const t = clk.t, i = Math.floor(t/B+1e-6);
  $('#bar').textContent = String(Math.floor(i/4)+1).padStart(2,'0')+'.'+(i%4+1);
  dots.forEach((d,k)=>d.classList.toggle('on', k===i%4));
  let s = logs[0][1]; for (const [at,txt] of logs) if (t>=at) s = txt; $('#log').textContent = s;
}},0);
tl.to('.warm',{opacity:1,duration:10,ease:'none'},0);

// S1 — 타자: 나는(박 0.5) / 믿습니다(박 2)
const ca = document.querySelectorAll('#la .ch'), cb = document.querySelectorAll('#lb .ch');
tl.from('#s1',{opacity:0,duration:.3},0.15);
[b(.5),b(1)].forEach((t,k)=>tl.set(ca[k],{display:'inline'},t));
for (let k=0;k<6;k++) tl.set('#c1',{opacity:k%2?1:0},0.2+k*0.21);
tl.set('#c1',{display:'none'},b(2)); tl.set('#c2',{display:'inline-block'},b(2));
[0,.12,.24,.36].forEach((d,k)=>tl.set(cb[k],{display:'inline'},b(2)+d));
for (let k=0;k<4;k++) tl.set('#c2',{opacity:k%2?1:0},b(2)+.6+k*.21);
tl.to('#la',{color:'rgba(239,232,218,.42)',duration:.3},b(2));
tl.to(['#la','#lb','#gut'],{yPercent:-110,opacity:0,duration:.32,ease:'power3.in',stagger:.04},b(4)-.36);

// S2 — 박마다 큰 단어 하나, 지나간 단어는 왼쪽 스택으로
for (let k=0;k<5;k++){
  const at = b(4+k), el = '#w'+k;
  tl.fromTo(el+' .w',{yPercent:105},{yPercent:0,duration:.5,ease:'expo.out'},at);
  tl.fromTo(el+' .k',{opacity:0,y:8},{opacity:1,y:0,duration:.35,ease:'power3.out'},at+.06);
  tl.fromTo(el+' .w',{scale:1.04},{scale:1,duration:.8,ease:'power3.out'},at);
  if (k<4){
    // 다음 박 직전에 위로 빠져나감(ease-in) → 같은 마스크에서 새 단어가 올라옴
    tl.to(el+' .w',{yPercent:-105,duration:.22,ease:'power3.in'},b(5+k)-.22);
    tl.to(el+' .k',{opacity:0,duration:.18,ease:'power2.in'},b(5+k)-.2);
    tl.set(el,{opacity:0},b(5+k)-.001);
    tl.fromTo('#stack div:nth-child('+(k+1)+')',{opacity:0,x:-10},{opacity:1,x:0,duration:.3},b(5+k));
  }
}
tl.to('#ul',{scaleX:1,duration:.9,ease:'expo.out'},b(9));
// 매치 컷: "다시 살아나" 밑줄 금선이 그대로 위로 올라가 길게 펴지며 십자가 가로대가 된다
tl.to(['#w4','#stack'],{opacity:0,duration:.35,ease:'power3.in'},b(10)-.45);
tl.to('#ul',{y:-239,scaleX:920/420,duration:.75,ease:'expo.inOut'},b(10)-.4);
tl.set('#cross .h',{scaleX:1},b(10)+.35);
tl.set('#ul',{opacity:0},b(10)+.35);
tl.to('#cross .h',{width:300,left:-150,duration:.6,ease:'power3.inOut'},b(10.75));
tl.to('#cross .v',{scaleY:1,duration:.7,ease:'expo.out'},b(10.75)+.05);
tl.to('#cross .glow',{opacity:1,duration:1.2,ease:'power3.out'},b(11));
tl.fromTo('#vref .q',{opacity:0,y:10},{opacity:1,y:0,duration:.5,ease:'power3.out'},b(11.25));
tl.fromTo('#vref .r',{opacity:0,letterSpacing:'.6em'},{opacity:1,letterSpacing:'.36em',duration:.7,ease:'expo.out'},b(11.25)+.15);

// S4 — 타이틀 카드 (박 13 = 10.83s), 2초 이상 정지
tl.to('#vref',{opacity:0,duration:.3,ease:'power3.in'},b(13)-.32);
tl.to('#cross',{y:-150,scale:.22,duration:.7,ease:'expo.inOut'},b(13)-.3);
tl.to('#cross .glow',{opacity:0,duration:.4},b(13)-.3);
tl.to('#title .ser',{opacity:1,duration:.5},b(13));
tl.fromTo('#title .main',{yPercent:105},{yPercent:0,duration:.8,ease:'expo.out'},b(13)+.1);
tl.to('#title .rule',{scaleX:1,duration:.6,ease:'expo.out'},b(13)+.45);
tl.fromTo('#title .sub',{opacity:0,y:10},{opacity:1,y:0,duration:.5},b(13)+.6);
tl.to('#title .txt',{opacity:1,duration:.5},b(13)+.8);
tl.to('.hud.br',{opacity:0,duration:.3},b(13));
Motion.ready();
</script></body></html>

  .tiles{position:absolute;display:flex;gap:10px;transform-origin:0 0}
  .tile{width:124px;height:136px;display:flex;align-items:center;justify-content:center;font-size:98px;line-height:1;
    box-shadow:2px 5px 8px rgba(0,0,0,.35);transform:scale(0)}
  .t-red{background:#c8352b;color:#fff;font-family:"Gmarket Sans TTF";font-weight:700}
  .t-cream{background:#f3ead6;color:#1d1a17;font-family:"Nanum Myeongjo","NanumMyeongjo";font-weight:800}
  .t-teal{background:#2f8c8c;color:#fff;font-family:"Pretendard";font-weight:800}
  .t-dark{background:#1e1c1a;color:#f3ead6;font-family:"Nanum Myeongjo","NanumMyeongjo";font-weight:800}
  .t-yel{background:#e8b83a;color:#1d1a17;font-family:"Gmarket Sans TTF";font-weight:700}
  .t-pink{background:#e99aa6;color:#1d1a17;font-family:"Noto Sans KR";font-weight:900}
  .sub-en{position:absolute;font-family:"IBM Plex Mono";font-size:20px;letter-spacing:.35em;color:#f3ead6}

  .tape{position:absolute;padding:8px 22px 6px 30px;background:#f6efdc;color:#26221e;font-family:"Nanum Pen Script OTF","Nanum Pen Script";font-size:54px;-webkit-text-stroke:.9px #26221e;
    white-space:nowrap;box-shadow:1px 3px 5px rgba(0,0,0,.3);transform:scale(0);display:flex;align-items:center;gap:6px;
    clip-path:polygon(0 6%,3% 0,97% 4%,100% 0,99% 50%,100% 100%,96% 95%,4% 100%,0 96%,2% 50%)}
  .tape::before{content:"";position:absolute;left:-6px;top:-4px;width:28px;height:120%;background:rgba(214,92,104,.55);transform:rotate(4deg)}
  .tape.teal::before{background:rgba(64,160,150,.55)}
  .tape svg{width:34px;height:30px;overflow:visible}
  .tape svg path{fill:none;stroke:#d0312d;stroke-width:4.5;stroke-linecap:round;stroke-linejoin:round}
  /* 자막 */
  .subs{position:absolute;left:0;right:0;bottom:30px;display:flex;justify-content:center;z-index:50}
  .sub{position:absolute;bottom:0;padding:8px 18px;background:rgba(14,12,10,.78);color:#fff;font-family:"Pretendard";font-weight:600;font-size:30px;letter-spacing:-.01em;white-space:nowrap;opacity:0}

  .cut{position:absolute;display:flex;gap:3px;transform-origin:0 50%}
  .cut span{display:inline-block;padding:3px 5px 1px;font:900 26px/1 "Gmarket Sans TTF";box-shadow:1px 2px 3px rgba(0,0,0,.35)}

  .cut span.sp{background:none;box-shadow:none;width:8px;padding:0}

    <g fill="#6f8a4c"><ellipse cx="540" cy="360" rx="18" ry="40" transform="rotate(-30 540 360)"/><ellipse cx="580" cy="350" rx="18" ry="44" transform="rotate(20 580 350)"/><ellipse cx="560" cy="320" rx="16" ry="46"/><ellipse cx="520" cy="300" rx="14" ry="36" transform="rotate(-40 520 300)"/><ellipse cx="602" cy="296" rx="14" ry="36" transform="rotate(40 602 296)"/></g>
    <path d="M560,420 V300" stroke="#5a4a32" stroke-width="4"/></g>
    <!-- 소파 -->
    <rect x="30" y="360" width="420" height="120" rx="26" fill="#e6dccb"/>
    <rect x="20" y="440" width="440" height="110" rx="20" fill="#ddd1bd"/>
    <rect x="10" y="400" width="70" height="150" rx="28" fill="#e9e0d0"/><rect x="400" y="400" width="70" height="150" rx="28" fill="#e9e0d0"/>
    <rect x="40" y="550" width="16" height="30" fill="#8a6a46"/><rect x="420" y="550" width="16" height="30" fill="#8a6a46"/>
    <path d="M300,400 C340,380 410,390 420,430 C380,460 320,450 300,400Z" fill="#b8c49c"/>
  </svg>
  <svg class="edge" id="roomEdge" style="left:0;top:-30px;width:1280px;height:40px" viewBox="0 0 1280 40"></svg>
  <div class="stk" id="sCat2" style="left:60px;top:262px;width:330px;height:230px"><svg viewBox="0 0 330 230"><g filter="url(#stk)">
    <rect x="10" y="120" width="300" height="80" rx="34" fill="#efe6d6"/><g stroke="#8fa58a" stroke-width="6"><path d="M40,130 V192 M90,124 V198 M140,122 V200 M190,122 V200 M240,124 V198 M282,130 V192"/></g>
    <use href="#sleepcat" transform="translate(24,10) scale(1.05)"/>
  </g></svg></div>
  <div class="stk" id="sToy" style="left:760px;top:520px;width:120px;height:80px"><svg viewBox="0 0 120 80"><g filter="url(#stk)">
    <path d="M70,52 C40,40 30,20 50,10 C80,0 104,30 100,52Z" fill="#a7a3a0"/><circle cx="58" cy="16" r="9" fill="#bdb8b3"/><circle cx="58" cy="16" r="5" fill="#e9b4ad"/><circle cx="92" cy="40" r="3" fill="#222"/><circle cx="101" cy="51" r="3" fill="#d98a86"/>
    <path d="M44,44 C20,54 20,70 4,66" fill="none" stroke="#c9a39a" stroke-width="3"/>
  </g></svg></div>
  <div class="stk" id="polar" style="left:1060px;top:60px;width:180px;height:220px"><svg viewBox="0 0 180 220"><g filter="url(#stk)">
    <rect x="0" y="0" width="180" height="220" fill="#fbfaf6"/><rect x="12" y="12" width="156" height="150" fill="#e7cf9c"/>
    <path d="M12,120 L168,110 L168,162 L12,162Z" fill="#d6a74c"/>
    <use href="#wildcat" transform="translate(52,26) scale(.33)"/>
  </g>
  <rect x="50" y="-14" width="80" height="26" fill="rgba(232,200,120,.75)" transform="rotate(-6 90 0)"/>
  <text x="90" y="198" text-anchor="middle" font-family="Nanum Pen Script OTF, Nanum Pen Script" font-size="32" stroke="#2a2420" stroke-width=".6" fill="#2a2420">쥐 사냥꾼</text>
  <path id="strike" d="M34,190 C70,186 110,192 148,186" stroke="#d0312d" stroke-width="4" fill="none" stroke-linecap="round"/>
  </svg></div>
  <div class="hand" id="guard" style="left:330px;top:160px;font-size:76px;clip-path:inset(0 100% 0 0)">소파 경비원 <svg width="44" height="40" viewBox="0 0 34 30" style="vertical-align:-4px;overflow:visible"><path d="M4,14 L12,24 L30,2" fill="none" stroke="#d0312d" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/></svg></div>

<!-- 라벨 (나일 위) -->
<div class="tape" id="lMouse" style="left:520px;top:300px">쥐</div>
<div class="tape teal" id="lHunter" style="left:70px;top:90px">쥐 사냥꾼 <svg viewBox="0 0 34 30"><path d="M4,14 L12,24 L30,2"/></svg></div>
<div class="tape" id="lGuest" style="left:70px;top:166px">손님 <svg viewBox="0 0 34 30"><path d="M4,14 L12,24 L30,2"/></svg></div>

<!-- 제목 타일 (처음 중앙 → 오른쪽 위 구석) -->
<div class="tiles" id="tiles1" style="left:366px;top:250px">
  <div class="tile t-red">1</div><div class="tile t-cream">만</div><div class="tile t-teal" style="margin-left:22px">년</div><div class="tile t-dark">전</div>
</div>
<div class="cut" id="en1" style="left:372px;top:410px"></div>

<div class="grain"></div>
<div class="subs">
  <div class="sub">1만 년 전, 사람들이 곡식을 쌓기 시작하자</div>
  <div class="sub">쥐가 몰려왔어요.</div>
  <div class="sub">쥐를 쫓아 야생 고양이가 따라왔고</div>
  <div class="sub">사람들은 이 손님을 반겼죠.</div>
  <div class="sub">그리고 1만 년 뒤…</div>
  <div class="sub">고양이는 이제 쥐 대신 소파를 지킵니다.</div>
</div>
</main>
<script src="../../lib/gsap.min.js"></script><script src="../../lib/stage.js"></script>
<script>
const r = Motion.rand(7), NS = 'http://www.w3.org/2000/svg';
const el = (tag, attrs, parent) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); parent.appendChild(e); return e; };
// 찢긴 흰 종이 가장자리 (horizontal: 가로 띠, 아니면 세로 띠)
function torn(id, horizontal, len){
  const s = document.getElementById(id); let d = '';
  if (horizontal){ d = 'M0,40 L0,20 '; for (let x=0;x<=len;x+=14) d += `L${x},${8 + r()*24} `; d += `L${len},40Z`; }
  else { d = 'M40,0 L20,0 '; for (let y=0;y<=len;y+=14) d += `L${8 + r()*24},${y} `; d += `L40,${len}Z`; }
  el('path', {d, fill:'#fbf6ea'}, s);
}
torn('roomEdge', true, 1280); torn('nightEdge', false, 720);
// 크라프트 아래 가장자리: 위아래 뒤집은 띠
(()=>{ const s = document.getElementById('kraftEdge'); let d='M0,0 '; for (let x=0;x<=1280;x+=14) d += `L${x},${8+r()*26} `; d+='L1280,0Z'; el('path',{d:d.replace('M0,0','M0,0'),fill:'#fbf6ea'},s);
  let d2='M0,0 '; for (let x=0;x<=1280;x+=18) d2 += `L${x},${2+r()*14} `; d2+='L1280,0Z'; el('path',{d:d2,fill:'#b98a52'},s); })();
// 곡식 낟알
const grains = document.getElementById('grains');
for (let i=0;i<120;i++){ const x = 40 + r()*340, top = 270 - 140*Math.sin(Math.PI*(x-10)/400), y = top + 6 + r()*(276-top);
  el('ellipse', {cx:x, cy:y, rx:6, ry:4, fill: r()<.5 ? '#f0c058' : '#e2a83e', stroke:'#b67d1f', 'stroke-width':.8, transform:`rotate(${r()*180} ${x} ${y})`}, grains); }
// 밀 줄무늬
const wheat = document.getElementById('wheat');
for (let i=0;i<90;i++){ const x = r()*1280, y = 390 + r()*320, h = 14 + (y-370)*.08; el('path', {d:`M${x},${y} l${-3+r()*6},${-h}`}, wheat); }
// 야자수
function palm(g, x, y, h, c){ el('path', {d:`M${x},${y} q6,${-h/2} 2,${-h}`, stroke:c, 'stroke-width':h/18, fill:'none'}, g);
  for (let k=0;k<6;k++){ const a = -160 + k*28; const ex = x+2 + Math.cos(a*Math.PI/180)*h*.45, ey = y-h + Math.sin(a*Math.PI/180)*h*.3 + h*.12;
    el('path', {d:`M${x+2},${y-h} Q${(x+2+ex)/2},${y-h-h*.12} ${ex},${ey}`, stroke:c, 'stroke-width':h/9, fill:'none', 'stroke-linecap':'round'}, g); } }
const palms = document.getElementById('palms');
[[800,380,150],[1250,390,170],[760,360,110],[700,372,90]].forEach(([x,y,h])=>palm(palms,x,y,h,'#4f5a2c'));
const far = document.getElementById('farpalms');
for (let i=0;i<9;i++) palm(far, 30+i*60+r()*20, 280, 30+r()*16, '#6e7a3c');
// 별
const stars = document.getElementById('stars'), starEls = [];
for (let i=0;i<34;i++){ const x = 30 + r()*1220, y = 20 + r()*680; if (x>300 && x<900 && y>260 && y<460) continue;
  const s = 5 + r()*8; let d=''; for (let k=0;k<10;k++){ const rr = k%2? s*.45 : s, a = -Math.PI/2 + k*Math.PI/5; d += (k?'L':'M') + (x+Math.cos(a)*rr).toFixed(1)+','+(y+Math.sin(a)*rr).toFixed(1); }
  starEls.push(el('path', {d:d+'Z', fill:'#f2c94c'}, stars)); }
for (let i=0;i<60;i++) el('circle', {cx:r()*1280, cy:r()*720, r:1+r()*1.2, fill:'#f3ead6', opacity:.6}, stars);

function draw(sel){ document.querySelectorAll(sel).forEach(p=>{ const L = p.getTotalLength(); p.style.strokeDasharray = L; p.style.strokeDashoffset = L; }); }
draw('.tape svg path'); draw('#guard path'); draw('#strike');

function cutWord(id, txt){ const e=document.getElementById(id); [...txt].forEach(ch=>{ const sp=document.createElement('span'); if(ch===' ') sp.className='sp'; else sp.textContent=ch; e.appendChild(sp); }); }
cutWord('en1','10,000 YEARS AGO'); cutWord('en2','10,000 YEARS LATER');
const tl = Motion.timeline();
const cutIn = (sel, t) => document.querySelectorAll(sel+' span').forEach((c,i)=> tl.fromTo(c, {opacity:0, y:-14, rotation:(i%3-1)*14}, {opacity:1, y:0, rotation:(i%3-1)*4, duration:.18, ease:'back.out(3)'}, t + i*.025));
const pop = (sel, t, rot) => tl.fromTo(sel, {scale:0, rotation:rot-14}, {scale:1, rotation:rot, duration:.55, ease:'back.out(2.2)'}, t);
const out = (sel, t) => tl.to(sel, {scale:0, rotation:'+=10', duration:.3, ease:'back.in(2)'}, t);
// 자막 싱크
const subs = document.querySelectorAll('.sub'), cue = [0, 2.6, 4.2, 6.6, 8.6, 10.5, 13.9];
subs.forEach((s,i)=>{ tl.set(s, {opacity:1}, cue[i] + (i?0:.05)); if (i < subs.length-1) tl.set(s, {opacity:0}, cue[i+1]); });

// 0–1.6 크라프트 위 랜섬 타일 철썩
document.querySelectorAll('#tiles1 .tile').forEach((t,i)=>{
  const rot = [-6,4,-3,7][i];
  tl.fromTo(t, {scale:1.9, rotation:rot*3, opacity:0}, {scale:1, rotation:rot, opacity:1, duration:.28, ease:'power4.in'}, .15 + i*.22);
  tl.to(t, {y:3, duration:.06, yoyo:true, repeat:1, ease:'sine.out'}, .43 + i*.22);
});
cutIn('#en1', .7);
// 1.6–2.3 크라프트가 위로 찢겨 걷히고 제목은 오른쪽 위로
tl.to('#kraft', {y:-780, rotation:-1.5, duration:.75, ease:'power2.in'}, 1.85);
tl.to('#en1', {x:1000-372, y:84-410, scale:.42, opacity:0, duration:.5, ease:'power3.in'}, 1.85);
tl.to('#tiles1', {x:1030-366, y:22-250, scale:.36, duration:.75, ease:'power3.inOut'}, 1.95);
tl.fromTo('#nileCam', {scale:1.08}, {scale:1.0, duration:7, ease:'sine.out'}, 1.85);
// 2.6 쥐
pop('#sMice', 2.7, -2);
pop('#lMouse', 3.3, -5);
// 4.2 야생 고양이
pop('#sCat', 4.4, 3);
tl.fromTo('#sMice', {x:0}, {x:-40, duration:.5, ease:'power2.out'}, 4.4);
pop('#lHunter', 5.1, -3);
tl.to('#lHunter path', {strokeDashoffset:0, duration:.35, ease:'power2.out'}, 5.55);
// 6.6 손님: 쥐·고양이 빠지고 항아리+바구니+자는 고양이
out('#sMice', 6.5); out('#sCat', 6.55); out('#lMouse', 6.5);
pop('#sJar', 6.8, -1.5);
pop('#lGuest', 7.3, 2);
tl.to('#lGuest path', {strokeDashoffset:0, duration:.35, ease:'power2.out'}, 7.75);
// 8.6 밤하늘이 찢긴 가장자리로 밀려 들어옴
tl.to('#night', {x:0, duration:.55, ease:'power3.out'}, 8.55);
tl.to(['#tiles1','#en1','#lHunter','#lGuest'], {opacity:0, duration:.2}, 8.75);
document.querySelectorAll('#tiles2 .tile').forEach((t,i)=>{
  const rot = [-4,5,-6,3][i];
  tl.fromTo(t, {scale:1.9, rotation:rot*3, opacity:0}, {scale:1, rotation:rot, opacity:1, duration:.26, ease:'power4.in'}, 9.0 + i*.18);
});
cutIn('#en2', 9.7);
starEls.forEach((s,i)=> tl.fromTo(s, {scale:.6, transformOrigin:'50% 50%', opacity:.5}, {scale:1.15, opacity:1, duration:.4, yoyo:true, repeat:1, ease:'sine.inOut'}, 8.7 + (i%7)*.12));
draw('#shoot'); tl.to('#shoot', {strokeDashoffset:0, duration:.6, ease:'power1.out'}, 9.2);
// 10.0 거실이 아래에서 찢겨 올라옴
tl.to('#room', {y:0, duration:.55, ease:'power3.out'}, 10.45);
pop('#sCat2', 10.9, -2);
pop('#sToy', 11.15, 8);
pop('#polar', 11.4, 6);
tl.to('#strike', {strokeDashoffset:0, duration:.35, ease:'power1.inOut'}, 11.95);
tl.to('#guard', {clipPath:'inset(0 0% 0 0)', duration:.7, ease:'none'}, 12.25);
tl.to('#guard path', {strokeDashoffset:0, duration:.25, ease:'power2.out'}, 12.95);
tl.fromTo('#room', {scale:1}, {scale:1.03, transformOrigin:'40% 50%', duration:2.7, ease:'sine.inOut', immediateRender:false}, 10.5);
Motion.ready();
</script></body></html>

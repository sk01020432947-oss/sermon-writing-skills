<script>
const TL = Motion.timeline();
// 기존 비트는 옛 절대 시각으로 쓰여 있으므로 OFF만큼 밀어 붙인다
let OFF = 0;
const tl = {to:(a,b,p)=>TL.to(a,b,p+OFF), from:(a,b,p)=>TL.from(a,b,p+OFF), fromTo:(a,b,c,p)=>TL.fromTo(a,b,c,p+OFF), set:(a,b,p)=>TL.set(a,b,p+OFF)};
const r = Motion.rand(17);
const NS = 'http://www.w3.org/2000/svg';
const $ = s => document.querySelector(s);
const mk = (tag, attrs, parent) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); parent && parent.appendChild(e); return e; };
const drawOn = (el, t0, dur, ease) => { const L = el.getTotalLength ? el.getTotalLength() : 900; el.style.strokeDasharray = L + ' ' + L; tl.fromTo(el, {strokeDashoffset: L}, {strokeDashoffset: 0, duration: dur, ease: ease || 'power1.inOut'}, t0); };

// 비트 표 (초)
const BEATS = [['#sA',0,1.0],['#sW',1.0,1.8],['#sB',1.8,2.8],['#sD',2.8,3.8],['#sC',3.8,4.6],['#sS',4.6,5.3],['#sBr',5.3,6.0],['#sE',6.0,7.2],['#sM',7.2,7.9],['#sF',7.9,8.8],['#sR',8.8,9.5],['#sG',9.5,10.5],['#sHs',10.5,11.1],['#sL',11.1,12.9],['#sTc',12.9,13.5],['#sK',13.5,17.4],['#sH',17.4,18.8],['#sI',18.8,99]];
BEATS.forEach(([s,a,b],i) => { if (i) tl.set(s,{visibility:'visible'},a); if (b < 99) tl.set(s,{visibility:'hidden'},b); });

/* ---------- a 수중: 캔버스, 시간 함수 ---------- */
const cA = $('#cA').getContext('2d');
const fish = Array.from({length:170},()=>({rad:90+r()*380, th:r()*6.283, w:(0.9+r()*0.8)*(r()<.85?1:-1), s:5+r()*5, c:['#3f6f73','#a2553a','#556a7a','#7a8f6a','#2f4f5c','#b07a52'][Math.floor(r()*6)], tilt:0.5+r()*0.12}));
const bub = Array.from({length:46},()=>({x:r()*1280, y:r()*900, v:60+r()*110, rr:2+r()*6, ph:r()*6}));
const weeds = Array.from({length:26},()=>({x:r()*1280, h:90+r()*190, ph:r()*6}));
function drawA(t){
  const c = cA, cx = 640, cy = 330;
  const g = c.createLinearGradient(0,0,0,720); g.addColorStop(0,'#b9d3cc'); g.addColorStop(.45,'#7fa9a7'); g.addColorStop(1,'#4d7c80');
  c.fillStyle = g; c.fillRect(0,0,1280,720);
  // 빛줄기
  for (let i=0;i<9;i++){ const x = i*160 - 80 + Math.sin(t*0.8+i)*18; c.fillStyle = 'rgba(255,255,240,0.07)';
    c.beginPath(); c.moveTo(x,0); c.lineTo(x+70,0); c.lineTo(x+250,720); c.lineTo(x+120,720); c.fill(); }
  // 해초
  c.lineCap='round';
  weeds.forEach(w=>{ c.strokeStyle='rgba(38,66,52,.75)'; c.lineWidth=5; c.beginPath(); c.moveTo(w.x,730);
    c.quadraticCurveTo(w.x+Math.sin(t*1.4+w.ph)*22, 730-w.h*.5, w.x+Math.sin(t*1.4+w.ph+1)*30, 730-w.h); c.stroke(); });
  // 물고기 떼: 물방울 주위를 소용돌이
  const tight = 1 - 0.18*Math.min(1,t/1.6);

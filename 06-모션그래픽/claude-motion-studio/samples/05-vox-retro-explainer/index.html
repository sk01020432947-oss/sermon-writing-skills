<script>
const NS = 'http://www.w3.org/2000/svg';
const el = (tag, attrs, parent, text) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (text) e.textContent = text; parent.appendChild(e); return e; };
// ── 빈티지 타자기 (회색 톤) 440x340
const tw = document.getElementById('tw');
el('rect', {x:150, y:0, width:140, height:62, fill:'#f2f0ea'}, tw);
el('path', {d:'M44,52 L12,28 L4,34 L36,60Z', fill:'#555'}, tw);
el('rect', {x:62, y:38, width:316, height:44, rx:22, fill:'url(#cyl)'}, tw);
[[50,60],[390,60]].forEach(([x,y])=>{ el('circle',{cx:x,cy:y,r:24,fill:'#2a2a2a'},tw); el('circle',{cx:x,cy:y,r:14,fill:'#5a5a5a'},tw); el('circle',{cx:x-4,cy:y-5,r:4,fill:'#9a9a9a'},tw); });
el('path', {d:'M58,88 L382,88 L428,306 L12,306Z', fill:'url(#bodyg)'}, tw);
el('path', {d:'M58,88 L90,88 L60,306 L12,306Z', fill:'#555', opacity:.6}, tw);
el('path', {d:'M125,160 A95,95 0 0 1 315,160Z', fill:'#3c3c3c'}, tw);
for (let a=184;a<=356;a+=4.5){ const rad=a*Math.PI/180; el('path',{d:`M${220+Math.cos(rad)*34},${160+Math.sin(rad)*34} L${220+Math.cos(rad)*92},${160+Math.sin(rad)*92}`,stroke:'#9b9b9b','stroke-width':1.6},tw); }
el('circle', {cx:220, cy:126, r:9, fill:'#bbb'}, tw);
el('rect', {x:70, y:160, width:300, height:22, fill:'#151515'}, tw);
el('path', {d:'M180,171 h80', stroke:'#c9c9c9', 'stroke-width':2}, tw);
const rows = ['1234567890','QWERTYUIOP','ASDFGHJKL','ZXCVBNM,.'];
rows.forEach((row,ri)=>{ const y = 200 + ri*28, n = row.length, x0 = 220 - (n-1)*15 + ri*6;
  [...row].forEach((ch,i)=>{ const x = x0 + i*30, hi = ri===1 && i<6; el('circle',{cx:x,cy:y,r:13.5,fill:hi?'#F4C430':'url(#cap)',stroke:hi?'#1c1a17':'#c4c4c4','stroke-width':2},tw);
    el('text',{x, y:y+5.6, 'text-anchor':'middle','font-family':'IBM Plex Mono','font-weight':700,'font-size':16,fill:hi?'#141210':'#f4f4f4'},tw,ch); }); });
el('rect', {x:140, y:312, width:160, height:11, rx:5, fill:'#9a9a9a', stroke:'#333'}, tw);
el('rect', {x:24, y:304, width:46, height:20, rx:4, fill:'#1a1a1a'}, tw); el('rect', {x:370, y:304, width:46, height:20, rx:4, fill:'#1a1a1a'}, tw);

// ── 큰 키캡 띠 Q W E R T Y (활자대 위)
const kg = document.getElementById('keysG');
el('path', {d:'M20,120 Q280,96 540,120 L540,215 L20,215Z', fill:'#2c2c2c'}, kg);
for (let i=0;i<6;i++){ const x = 60 + i*88; el('path',{d:`M${x-10},120 L${x-24},210 L${x+6},210 L${x+12},120Z`,fill:'#6a6a6a'},kg); el('circle',{cx:x+14,cy:190,r:28,fill:'#3a3a3a',stroke:'#7b7b7b','stroke-width':3},kg); }
'QWERTY'.split('').forEach((ch,i)=>{ const x = 60 + i*88, y = 78 - (i%2)*6;
  el('circle',{cx:x,cy:y,r:44,fill:'#8c8c8c'},kg); el('circle',{cx:x,cy:y,r:38,fill:'url(#cap)'},kg); el('circle',{cx:x,cy:y,r:34,fill:'none',stroke:'#cfcfcf','stroke-width':2},kg);
  el('text',{x, y:y+15, 'text-anchor':'middle','font-family':'NanumMyeongjo','font-weight':800,'font-size':42,fill:'#efefef'},kg,ch); });

// ── 청사진: 활자대 바구니
const bp = document.getElementById('bpDraw'), grid = document.getElementById('grid');
for (let x=20;x<980;x+=40) el('path',{d:`M${x},0 V560`},grid); for (let y=20;y<560;y+=40) el('path',{d:`M0,${y} H980`},grid);
const bpPaths = [];
const P = (d, w) => { const p = el('path',{d},bp); if (w) p.setAttribute('stroke-width', w); bpPaths.push(p); return p; };
P('M150,110 H830 A26,26 0 0 1 830,162 H150 A26,26 0 0 1 150,110Z'); P('M150,124 H830 M150,148 H830', 1);
P('M108,136 A40,40 0 1 0 108,137 M872,136 A40,40 0 1 0 872,137');
P('M120,190 L860,190 L920,470 L60,470Z'); P('M60,470 H920 M90,490 H890', 1.4);
for (let a=192;a<=348;a+=4){ const rad=a*Math.PI/180; P(`M${490+Math.cos(rad)*60},${300+Math.sin(rad)*44} L${490+Math.cos(rad)*270},${300+Math.sin(rad)*130}`, 1.3); }
P('M220,300 A270,130 0 0 1 760,300', 2.6); P('M430,300 A60,44 0 0 1 550,300', 2);
P('M490,190 V256', 1.2);
for (let i=0;i<10;i++) P(`M${200+i*64},420 a14,14 0 1 0 0.1,0`, 1.6);
P('M150,380 L60,250 M830,380 L920,250', 1.4);
// 기계 디테일: 톱니·레버·치수선
[[96,330,44],[884,330,44]].forEach(([cx,cy,R])=>{ P(`M${cx+R},${cy} A${R},${R} 0 1 0 ${cx+R},${cy+.1}`, 1.6); P(`M${cx+R*.45},${cy} A${R*.45},${R*.45} 0 1 0 ${cx+R*.45},${cy+.1}`, 1.2);
  for (let k=0;k<12;k++){ const a=k*Math.PI/6; P(`M${cx+Math.cos(a)*R},${cy+Math.sin(a)*R} L${cx+Math.cos(a)*(R+9)},${cy+Math.sin(a)*(R+9)}`, 2.4); } });
for (let i=0;i<14;i++) P(`M${150+i*49},170 l-18,20`, .9);
P('M150,74 H830 M150,66 V82 M830,66 V82', 1); P('M40,190 V470 M32,190 H48 M32,470 H48', 1);
P('M250,190 C230,250 210,330 200,420 M730,190 C750,250 770,330 780,420', 1.2);

// ── 노트북 / 스마트폰
const lg = document.getElementById('lapG');
el('rect',{x:20,y:10,width:320,height:22,rx:6,fill:'#2a2a2a'},lg);
el('rect',{x:10,y:30,width:340,height:220,rx:16,fill:'url(#silver)'},lg);
el('rect',{x:30,y:44,width:300,height:120,rx:6,fill:'#262626'},lg);
const lr = ['QWERTYUIOP','ASDFGHJKL','ZXCVBNM'];
for (let i=0;i<12;i++) el('rect',{x:36+i*24.4,y:50,width:20,height:16,rx:3,fill:'#3d3d3d'},lg);
lr.forEach((row,ri)=>[...row].forEach((ch,i)=>{ const x = 46+ri*10+i*24.4, y = 72+ri*22;
  el('rect',{x,y,width:20,height:18,rx:3,fill: ri===0 && i<6 ? '#F4C430' : '#3d3d3d'},lg); }));
el('rect',{x:110,y:138,width:140,height:18,rx:3,fill:'#3d3d3d'},lg);
el('rect',{x:120,y:176,width:120,height:62,rx:6,fill:'#c6c6c6',stroke:'#aaa'},lg);
const pg = document.getElementById('phoneG');
el('rect',{x:6,y:4,width:148,height:292,rx:24,fill:'#1b1b1b'},pg);
el('rect',{x:14,y:14,width:132,height:272,rx:18,fill:'#f3f2ee'},pg);
el('rect',{x:58,y:20,width:44,height:10,rx:5,fill:'#1b1b1b'},pg);
el('rect',{x:14,y:186,width:132,height:100,fill:'#d4d4d2'},pg);
[10,9,7].forEach((n,ri)=>{ for (let i=0;i<n;i++){ const x = 18 + (10-n)*6.4 + i*12.8, y = 194+ri*24;
  el('rect',{x,y,width:10.6,height:19,rx:2,fill: ri===0 && i<6 ? '#F4C430' : '#fbfbfa'},pg); } });
el('rect',{x:46,y:266,width:68,height:14,rx:3,fill:'#fbfbfa'},pg);
el('rect',{x:24,y:40,width:100,height:16,rx:8,fill:'#e2e0d8'},pg); el('rect',{x:40,y:66,width:96,height:16,rx:8,fill:'#cfe0f0'},pg);

function prep(nodes){ nodes.forEach(p=>{ const L = p.getTotalLength(); p.style.strokeDasharray = L; p.style.strokeDashoffset = L; }); }
prep(bpPaths); prep([...document.querySelectorAll('#arrows path')]); prep([document.getElementById('ring'), document.getElementById('x1'), document.getElementById('x2'), document.getElementById('axis'), document.getElementById('leadA')]);

const tl = Motion.timeline();
const B = 'blur(14px)', C = 'blur(0px)';
// 자막
const subs = document.querySelectorAll('.sub'), cue = [0.1, 3.2, 6.6, 10.6];
subs.forEach((s,i)=>{ tl.set(s,{opacity:1},cue[i]); if (i<subs.length-1) tl.set(s,{opacity:0},cue[i+1]); });
// 카메라 느린 푸시인
tl.fromTo('#cam', {scale:1}, {scale:1.05, duration:14, ease:'none'}, 0);

// ── A 0–3.2: 키캡 띠 → Q → QWERTY → 타자기 옆에서 밀려옴
tl.fromTo('#keys', {x:-330, y:30, scale:1.25, filter:B, opacity:0}, {filter:C, opacity:1, duration:.6, ease:'power2.out'}, 0);
tl.fromTo('#ktape', {x:-330-60, y:30, opacity:0}, {opacity:1, duration:.2}, .5);
tl.fromTo('#qw', {x:-330, y:40, scale:1.3, transformOrigin:'0 50%'}, {x:-330, duration:.01}, 0);
const L = document.querySelectorAll('#qw .l');
tl.to(L[0], {opacity:1, duration:.12}, .35);
tl.fromTo('#qw .bar', {scaleX:0}, {scaleX:.2, duration:.25, ease:'power2.out'}, .4);
tl.to([...L].slice(1), {opacity:1, duration:.08, stagger:.08}, .95);
tl.to('#qw .bar', {scaleX:.86, duration:.5, ease:'power2.out'}, .95);
// 1.6 측면 슬라이드: 키캡·제목 오른쪽 자리로, 타자기 등장(블러)
tl.to(['#keys','#qw'], {x:0, y:0, scale:1, duration:.8, ease:'power3.inOut'}, 1.6);
tl.to('#ktape', {x:0, y:0, duration:.8, ease:'power3.inOut'}, 1.6);
tl.fromTo('#tw1', {x:-640, filter:B}, {x:0, filter:C, duration:.8, ease:'power3.out'}, 1.65);
tl.fromTo('#tw1tape', {opacity:0}, {opacity:1, duration:.15}, 2.3);
tl.fromTo('#t1870', {scale:1.8, opacity:0, rotation:-16}, {scale:1, opacity:1, rotation:-7, duration:.3, ease:'power4.in'}, 2.2);
tl.fromTo('#callA', {opacity:0}, {opacity:1, duration:.2}, 2.55);
tl.to('#leadA', {strokeDashoffset:0, duration:.3}, 2.55);
// ── B 3.2–6.6: 모두 왼쪽으로 빠지고 청사진 등장
tl.to(['#tw1','#tw1tape','#t1870','#callA','#keys','#ktape','#qw'], {x:'-=1500', filter:B, opacity:0, duration:.7, ease:'power3.in'}, 3.15);
tl.to('#bp', {x:0, duration:.75, ease:'power3.out'}, 3.4);
tl.fromTo('#bp', {filter:B}, {filter:C, duration:.75, ease:'power3.out', immediateRender:false}, 3.4);
tl.to(bpPaths, {strokeDashoffset:0, duration:.7, stagger:.012, ease:'power1.out'}, 3.55);
tl.to('#arrows path', {strokeDashoffset:0, duration:.35, stagger:.12, ease:'power2.out'}, 4.4);
tl.fromTo('#tangle', {scale:1.6, opacity:0}, {scale:1, opacity:1, duration:.25, ease:'power4.in'}, 5.0);
tl.to('#ring', {strokeDashoffset:0, duration:.6, ease:'power1.inOut'}, 5.2);
tl.fromTo('#stamp', {scale:2, opacity:0}, {scale:1, opacity:1, duration:.22, ease:'power4.in'}, 5.85);
// ── C 6.6–10.6: 청사진 빠지고 타자기 단독 → X → 타임라인
tl.to('#bp', {x:-1400, filter:B, duration:.6, ease:'power3.in'}, 6.5);
tl.fromTo('#tw2', {opacity:0, x:500, filter:B}, {opacity:1, x:0, filter:C, duration:.6, ease:'power3.out'}, 6.75);
tl.fromTo('#lb1', {opacity:0, y:12}, {opacity:1, y:0, duration:.3}, 7.05);
tl.to('#x1', {strokeDashoffset:0, duration:.28, ease:'power2.in'}, 7.45);
tl.to('#x2', {strokeDashoffset:0, duration:.28, ease:'power2.in'}, 7.78);
tl.to('#tw2', {x:-400, y:80, scale:.6, duration:.7, ease:'power3.inOut'}, 8.3);
tl.to('#lb1', {left:240, top:504, duration:.7, ease:'power3.inOut'}, 8.3);
tl.to('#axis', {strokeDashoffset:0, duration:.9, ease:'power2.inOut'}, 8.5);
tl.to('#axhead', {opacity:1, duration:.1}, 9.35);
tl.fromTo('.node', {scale:0, transformOrigin:'50% 50%'}, {scale:1, duration:.25, stagger:.25, ease:'back.out(3)'}, 8.6);
tl.fromTo('#laptop', {opacity:0, x:420, y:-20, rotation:16, filter:B}, {opacity:1, x:0, y:0, rotation:0, filter:C, duration:.6, ease:'expo.out'}, 8.85);
tl.to('#lb2', {opacity:1, duration:.25}, 9.15);
tl.fromTo('#phone', {opacity:0, x:360, y:-20, rotation:22, filter:B}, {opacity:1, x:0, y:0, rotation:0, filter:C, duration:.6, ease:'expo.out'}, 9.45);
tl.to('#lb3', {opacity:1, duration:.25}, 9.75);
// ── D 10.6–14: 살짝 물러나며 큰 결론 + 노란 밑줄
tl.to(['#tw2','#laptop','#phone'], {y:'+=30', duration:.8, ease:'power2.inOut'}, 10.5);
tl.fromTo('#fin', {opacity:0, y:-30, filter:B}, {opacity:1, y:0, filter:C, duration:.5, ease:'power3.out'}, 10.6);
tl.fromTo('#fin2', {opacity:0}, {opacity:0, duration:.01}, 10.6);
tl.fromTo('#fin .bar', {scaleX:0}, {scaleX:.68, duration:.5, ease:'power2.out'}, 11.0);
// 두 박자: '그대로.' 철썩 → 밑줄 끝까지
tl.fromTo('#fin2', {opacity:0, scale:1.7, rotation:-6}, {opacity:1, scale:1, rotation:0, duration:.24, ease:'power4.in'}, 11.75);
tl.to('#cam', {x:-4, y:3, duration:.05, yoyo:true, repeat:3, ease:'none'}, 11.99);
tl.to('#fin .bar', {scaleX:1, duration:.35, ease:'power3.out'}, 11.99);
// QWERTY 꼬리표가 시간 순으로 깜빡: 같은 배열이 이어진다
document.querySelectorAll('.ytag').forEach((y,i)=> tl.fromTo(y, {scale:1}, {scale:1.25, duration:.14, yoyo:true, repeat:1, ease:'power2.out'}, 12.4 + i*.18));
Motion.ready();
</script></body></html>

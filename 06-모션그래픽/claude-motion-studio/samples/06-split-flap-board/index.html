<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><title>스플릿 플랩 보드 · Split-Flap Board</title>
<link rel="stylesheet" href="../../lib/stage.css">
<style>
  .frame{background:#060807 !important;background-image:none !important}
  .scene{position:absolute;inset:0;overflow:hidden}
  :root{--ink:#E9E6DE;--amber:#F5A80A;--blue:#3D5BFF;--mono:'IBM Plex Mono',monospace}
  .bg{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 42%,#121413 0%,#060807 75%)}
  .panel{position:absolute;left:32px;top:30px;width:1216px;height:540px;border-radius:12px;
    background:repeating-linear-gradient(0deg,rgba(255,255,255,.014) 0 1px,transparent 1px 3px),linear-gradient(#232528,#1b1c1f);
    box-shadow:0 40px 80px rgba(0,0,0,.6),0 0 0 1px rgba(255,255,255,.035),inset 0 1px 0 rgba(255,255,255,.05)}
  .screw{position:absolute;width:7px;height:7px;border-radius:50%;background:#2b2d30;box-shadow:inset 0 1px 1px rgba(0,0,0,.6)}
  .hdr{position:absolute;left:34px;right:34px;top:30px;display:flex;justify-content:space-between;align-items:center}
  .hdr .l{display:flex;align-items:center;gap:14px;font:700 16px/1 var(--mono);color:#cfccc4;letter-spacing:.14em}
  .hdr .l b{display:inline-block;width:11px;height:11px;background:var(--amber)}
  .hdr .l em{font:600 15px/1 Pretendard;font-style:normal;letter-spacing:0;color:#8d8a84}
  .hdr .r{font:500 13px/1 var(--mono);color:#4a4c4f;letter-spacing:.22em}
  .bd{position:absolute;inset:0}
  .lbl{position:absolute;font:500 11px/1 var(--mono);color:#56585b;letter-spacing:.14em;white-space:nowrap}
  .lbl i{font:600 12px/1 Pretendard;font-style:normal;letter-spacing:0;color:#6a6c6f;margin-right:6px}
  .lbl.amb{color:var(--amber);font-weight:700}
  .plate{position:absolute;border-radius:7px;background:#121214;box-shadow:inset 0 2px 4px rgba(0,0,0,.7),0 1px 0 rgba(255,255,255,.04)}
  .tile{position:absolute}
  .h{position:absolute;left:0;right:0;overflow:hidden;backface-visibility:hidden}
  .h span{position:absolute;left:0;right:0;text-align:center;font-family:Pretendard;font-weight:800;color:var(--ink)}
  .ftop{z-index:2}.fbot{z-index:2}
  .sh{position:absolute;left:0;right:0;background:linear-gradient(rgba(0,0,0,.85),rgba(0,0,0,.15));opacity:0;z-index:1}
  .seam{position:absolute;left:0;right:0;height:2px;background:#09090a;z-index:3;box-shadow:0 1px 0 rgba(255,255,255,.05)}
  .pin{position:absolute;width:3px;height:10px;background:#0b0b0c;border-radius:1px;z-index:4}
  .lamp{position:absolute;display:grid;grid-auto-rows:10px;gap:3px}
  .lamp i{width:9px;height:9px;border-radius:50%;background:#2d2e31}
  .note{position:absolute;font:600 15px/1 Pretendard;color:#8d8a84}
  .foot{position:absolute;left:34px;top:506px;font:500 11px/1 var(--mono);color:#4a4c4f;letter-spacing:.14em}
  .ring{position:absolute;left:514px;top:48px;width:188px;height:124px;border:3px solid var(--blue);border-radius:12px;
    box-shadow:0 0 16px rgba(61,91,255,.65),inset 0 0 12px rgba(61,91,255,.35);opacity:0}
  .dot{position:absolute;width:6px;height:6px;border-radius:50%;background:#8d8a84}
</style></head>
<body data-no="S06" data-cat="스타일 · STYLE" data-ko="스플릿 플랩 보드" data-en="Split-Flap Board" data-meta="출발 안내판 · 글자 타일 넘김" data-dur="16" data-poster="10.4" data-size="1280x720">
<main class="scene">
  <div class="bg"></div>
  <div class="panel" id="panel">
    <i class="screw" style="left:12px;top:12px"></i><i class="screw" style="right:12px;top:12px"></i>
    <i class="screw" style="left:12px;bottom:12px"></i><i class="screw" style="right:12px;bottom:12px"></i>
    <div class="hdr"><span class="l"><b></b>STEP 05 <em id="hdrL">운행 안내 · 다음 노선</em></span><span class="r" id="hdrR">MOTION TERMINAL</span></div>
    <!-- 1판: 출발 안내 -->
    <div class="bd" id="B1">
      <div id="L1">
        <div class="lbl" style="left:34px;top:86px">NO.</div>
        <div class="lbl" style="left:196px;top:86px"><i>행선지</i>DESTINATION</div>
        <div class="lbl" style="left:686px;top:86px"><i>상태</i>STATUS</div>
        <div class="lbl" style="left:1092px;top:86px">LAMP</div>
      </div>
      <div class="note" id="note" style="left:686px;top:466px;opacity:0">…없을까?</div>
    </div>
    <!-- 2판: 신규 노선 -->
    <div class="bd" id="B2" style="opacity:0">
      <div class="ring" id="ring"></div>
      <i class="dot" style="left:505px;top:213px"></i>
      <div class="lbl" id="today" style="left:96px;top:270px;opacity:0"><i>오늘</i>TODAY · 예약 현황</div>
    </div>
    <!-- 3판: 곧 상영 -->
    <div class="bd" id="B3" style="opacity:0">
      <div class="lbl amb" style="left:330px;top:70px">NEXT</div>
      <div class="lbl" style="left:330px;top:232px"><i>제작</i>MAKING</div>
      <div class="lbl" style="left:520px;top:232px"><i>속도</i>SPEED</div>
      <div class="lbl" style="left:710px;top:232px"><i>길이</i>LENGTH</div>
      <div class="lbl" style="left:330px;top:362px"><i>상태</i>STATUS</div>
    </div>
    <div class="foot" id="foot">GATE 05 · 운행 기록 3건</div>
  </div>
</main>
<script src="../../lib/gsap.min.js"></script><script src="../../lib/stage.js"></script>
<script>
const r = Motion.rand(6);
const $ = s => document.querySelector(s);
const HAN = [...'가나다라마바사아자차카타파하거너더러머버서어저처고노도로모보소오조초'];
const DIG = [...'0123456789'];
const isDig = c => /[0-9:→]/.test(c);
// 숫자 칸은 숫자만, 한글 칸은 한글만 거친다. 빈칸으로 갈 때는 직전 글자 종류를 따른다.
const poolFor = (ch, prev) => (ch === ' ' ? isDig(prev) : isDig(ch)) ? DIG : HAN;
const D = 0.075;                         // 한 장 넘김(초)
const AMB = '#F5A80A', INK = '#E9E6DE', DIM = '#6E6B66', LAV = '#A9B8FF', DARK = '#241703';
const BG = [['linear-gradient(#222125,#1c1b1e)', 'linear-gradient(#18181a,#141416)'],
            ['linear-gradient(#FBB523,#F2A409)', 'linear-gradient(#E39A06,#D48F05)']];
const T = [];

// ---- 타일 하나: 위·아래 정지 반쪽, 접히는 위, 펼쳐지는 아래, 그림자, 이음매, 경첩 핀 ----
function mk(host, x, y, w, h, fs, ri = -1) {
  const el = document.createElement('div'); el.className = 'tile';
  Object.assign(el.style, {left: x + 'px', top: y + 'px', width: w + 'px', height: h + 'px'});
  const hh = h / 2, rad = Math.max(3, Math.round(w / 14));
  const half = (cls, top) => `<div class="h ${cls}" style="top:${top ? 0 : hh}px;height:${hh}px;transform-origin:50% ${top ? '100%' : '0'};border-radius:${top ? `${rad}px ${rad}px 0 0` : `0 0 ${rad}px ${rad}px`}"><span style="top:${top ? 0 : -hh}px;height:${h}px;line-height:${h}px;font-size:${fs}px"></span></div>`;
  el.innerHTML = half('top', 1) + half('bot', 0) + `<i class="sh" style="top:${hh}px;height:${hh}px;border-radius:0 0 ${rad}px ${rad}px"></i>` +
    half('ftop', 1) + half('fbot', 0) + `<i class="seam" style="top:${hh - 1}px"></i>` +
    `<i class="pin" style="left:-1px;top:${hh - 5}px"></i><i class="pin" style="right:-1px;top:${hh - 5}px"></i>`;
  host.appendChild(el);
  const hs = [...el.querySelectorAll('.h')];
  const o = {el, hs, s: hs.map(e => e.querySelector('span')), sh: el.querySelector('.sh'), ri, d: D * (0.9 + r() * 0.25),
    ev: [{t: -1, ch: ' ', col: INK, bg: 0, n: 0, g: []}]};
  T.push(o); return o;
}
function plate(host, x, y, w, h) {
  const pl = document.createElement('div'); pl.className = 'plate';
  Object.assign(pl.style, {left: x - 6 + 'px', top: y - 6 + 'px', width: w + 12 + 'px', height: h + 12 + 'px'});
  host.appendChild(pl);
}
function line(host, x, y, n, w, h, fs, gap = 4, ri = -1) {
  plate(host, x, y, n * (w + gap) - gap, h);
  return [...Array(n)].map((_, i) => mk(host, x + i * (w + gap), y, w, h, fs, ri));
}
function lamp(host, x, y, cols) {
  const l = document.createElement('div'); l.className = 'lamp';
  Object.assign(l.style, {left: x + 'px', top: y + 'px', gridTemplateColumns: `repeat(${cols},10px)`});
  l.innerHTML = '<i></i>'.repeat(cols * 3); host.appendChild(l); return [...l.children];
}
// 예약: 한 칸에 (시각, 글자, 색, 바탕) — 무작위 글자 n장을 거쳐 정착, 칸마다 미세 지터
function put(tt, ch, t, col = INK, bg = 0, n) {
  const prev = tt.ev[tt.ev.length - 1];
  if (prev.ch === ch && prev.col === col && prev.bg === bg) return;
  if (n === undefined) n = ch === ' ' && prev.ch === ' ' ? 1 : 4 + Math.floor(r() * 7);
  const pool = poolFor(ch, prev.ch);
  const g = [...Array(n)].map(() => pool[Math.floor(r() * pool.length)]);
  tt.ev.push({t: n > 1 ? t + r() * 0.035 : t, ch, col, bg, n, g});
}
const text = (ts, str, t0, col, bg, st = 0.04, n) => [...str.padEnd(ts.length)].forEach((ch, i) => put(ts[i], ch, t0 + i * st, col, bg, n));
const blank = (ts, t0, st = 0.03) => ts.forEach((tt, i) => put(tt, ' ', t0 + i * st, INK, 0, 2 + Math.floor(r() * 3)));

// ================= 1판 출발 안내 0 – 6.1 =================
const B1 = $('#B1'), P = 76;
const ROWY = [118, 236, 354], R1 = [], LAMPS = [];
ROWY.forEach((y, ri) => {
  R1.push({no: line(B1, 34, y, 2, 72, 92, 54, 4, ri), dest: line(B1, 196, y, 6, 72, 92, 54, 4, ri), stat: line(B1, 686, y, 5, 72, 92, 54, 4, ri)});
  LAMPS.push(lamp(B1, 1092, y + 26, 8));
});
function setRow(ri, no, dest, stat, t0, col = {}) {
  const q = R1[ri];
  text(q.no, no, t0, INK, 0, 0.04);
  text(q.dest, dest, t0 + 0.08, col.dest || INK, 0, 0.04);
  text(q.stat, stat, t0 + 0.32, col.stat || INK, 0, 0.04);
}
setRow(0, '01', '콘텐츠', '운행완료', 0.55);
setRow(1, '02', '재미', '운행완료', 1.05);
setRow(2, '03', '실무', '고민중', 1.7);
setRow(2, '03', '광고 영상', '결정', 3.45, {dest: AMB, stat: AMB});
R1.forEach((q, ri) => blank([...q.no, ...q.dest, ...q.stat], 5.75 + ri * 0.08, 0.018));   // 판 비우기 물결

// ================= 2판 신규 노선 6.3 – 10.9 =================
const B2 = $('#B2');
const icon = line(B2, 528, 62, 2, 78, 96, 0, 4);                     // 빈 타일 두 장 = 2x2 아이콘
const name = [...line(B2, 400, 186, 2, 46, 60, 32, 4), ...line(B2, 520, 186, 6, 46, 60, 32, 4)];
const slots = [0, 1, 2, 3].map(k => {
  const x = 96 + k * 271;
  return {tm: line(B2, x, 292, 5, 40, 54, 30, 3), rv: line(B2, x + 2, 362, 4, 46, 40, 22, 4)};
});
text(name, '빈칸가상 서비스', 6.95, INK, 0, 0.045);
[0, 1].forEach(i => put(name[i], name[i].ev.at(-1).ch, 7.6 + i * 0.04, LAV, 0, 1));   // '빈칸'만 푸른빛으로 한 장 더
const TIMES = ['10:00', '13:30', '16:00', '19:30'];
slots.forEach((s, k) => {
  text(s.tm, TIMES[k], 8.0 + k * 0.16, INK, 0, 0.035, 6 + Math.floor(r() * 4));
  text(s.rv, '예약완료', 8.95 + k * 0.16, DARK, 1, 0.05);
});
const all2 = [...icon, ...name, ...slots.flatMap(s => [...s.tm, ...s.rv])];
blank(all2, 10.9, 0.008);

// ================= 3판 곧 상영 11.3 – 16 =================
const B3 = $('#B3');
const big = line(B3, 330, 92, 5, 80, 104, 62, 6);
const fMake = line(B3, 330, 256, 2, 54, 70, 38, 4), fSpeed = line(B3, 520, 256, 2, 54, 70, 38, 4), fLen = line(B3, 710, 256, 4, 54, 70, 38, 4);
const stat3 = line(B3, 330, 386, 5, 54, 70, 38, 4);
const LAMP3 = lamp(B3, 640, 404, 12);
text(big, '빈칸 광고', 11.35, INK, 0, 0.06);
text(stat3, '준비중', 11.8, '#8f8b84', 0, 0.05);
text(fMake, '쉽게', 12.45, INK, 0, 0.05);
text(fSpeed, '바로', 12.65, INK, 0, 0.05);
text(fLen, '0:22', 12.85, INK, 0, 0.05);
text(stat3, '상영 임박', 13.9, AMB, 0, 0.05);

// 완료 행은 글자만 회색으로 가라앉는다 [시작, 끝] — 그 시각 이후에 정착한 글자는 제외
const DIMW = {0: [2.3, 6.0], 1: [2.6, 6.1]};
const hex = c => [1, 3, 5].map(i => parseInt(c.slice(i, i + 2), 16));
const mix = (a, b, k) => { const A = hex(a), B = hex(b); return 'rgb(' + A.map((v, i) => Math.round(v + (B[i] - v) * k)).join(',') + ')'; };
function shade(col, ri, t, et) {
  const w = DIMW[ri]; if (!w || col !== INK || et >= w[1]) return col;
  const k = Math.min(1, Math.max(0, (t - w[0]) / 0.5));
  return k ? mix(INK, DIM, k) : col;
}
const paint = (hEl, sp, ch, col, bg, top) => { sp.textContent = ch; sp.style.color = col; hEl.style.background = BG[bg][top ? 0 : 1]; };
const ease2 = x => x * x;
function render(t) {
  for (const tt of T) {
    let e = 0; while (e + 1 < tt.ev.length && tt.ev[e + 1].t <= t) e++;
    const ev = tt.ev[e], before = e > 0 ? tt.ev[e - 1] : ev, d = tt.d;
    let oC = ev.ch, nC = ev.ch, p = 1, oCol = ev.col, oBg = ev.bg, oT = ev.t, settle = -1;
    const run = t - ev.t;
    if (ev.n > 0 && run < ev.n * d) {
      const k = Math.floor(run / d); p = (run - k * d) / d;
      oC = k === 0 ? before.ch : ev.g[k - 1];
      nC = k === ev.n - 1 ? ev.ch : ev.g[k];
      if (k === 0) { oCol = before.col; oBg = before.bg; oT = before.t; }
    } else if (ev.n > 0 && run < ev.n * d + 0.1) settle = (run - ev.n * d) / 0.1;
    const nc = shade(ev.col, tt.ri, t, ev.t), oc = shade(oCol, tt.ri, t, oT);
    const [top, bot, ftop, fbot] = tt.hs, [s0, s1, s2, s3] = tt.s;
    paint(top, s0, nC, nc, ev.bg, 1);
    paint(bot, s1, p < 1 ? oC : nC, p < 1 ? oc : nc, p < 1 ? oBg : ev.bg, 0);
    paint(ftop, s2, oC, oc, oBg, 1);
    paint(fbot, s3, nC, nc, ev.bg, 0);
    tt.sh.style.opacity = 0;
    if (p >= 1) {
      ftop.style.visibility = 'hidden';
      if (settle >= 0) {   // 마지막 장이 바닥에 닿고 살짝 튀었다 가라앉음
        fbot.style.visibility = 'visible'; fbot.style.filter = 'none';
        fbot.style.transform = `perspective(300px) rotateX(${9 * Math.sin(Math.PI * settle) * (1 - settle)}deg)`;
      } else fbot.style.visibility = 'hidden';
      continue;
    }
    if (p < 0.5) {         // 위 반쪽이 중력처럼 가속하며 떨어진다(ease-in), 내려올수록 어두워짐
      const q = ease2(p / 0.5);
      ftop.style.visibility = 'visible'; fbot.style.visibility = 'hidden';
      ftop.style.transform = `perspective(300px) rotateX(${-q * 90}deg)`;
      ftop.style.filter = `brightness(${1 - q * 0.55})`;
      tt.sh.style.opacity = q * 0.7;    // 떨어지는 판의 그림자가 아래 반쪽에 드리움
    } else {               // 새 아래 반쪽이 펼쳐져 덮는다
      const q = ease2((p - 0.5) / 0.5);
      ftop.style.visibility = 'hidden'; fbot.style.visibility = 'visible';
      fbot.style.transform = `perspective(300px) rotateX(${(1 - q) * 90}deg)`;
      fbot.style.filter = `brightness(${0.45 + q * 0.55})`;
      tt.sh.style.opacity = q < 0.5 ? 0.7 * (1 - q) : 0;   // 한 프레임만 남는 그림자
    }
  }
  // 램프: 강조는 호박색 빛이 좌→우로 흐름, 완료 행은 옅은 회색
  const glow = (dots, cols, active, done) => dots.forEach((dt, i) => {
    if (active) {
      const wave = 0.55 + 0.45 * Math.cos(((i % cols) / cols - t * 1.2) * Math.PI * 2);
      dt.style.background = AMB; dt.style.opacity = wave.toFixed(2);
      dt.style.boxShadow = `0 0 ${4 + wave * 6}px rgba(245,168,10,${0.5 * wave})`;
    } else { dt.style.background = done ? '#77777a' : '#2d2e31'; dt.style.opacity = 1; dt.style.boxShadow = 'none'; }
  });
  LAMPS.forEach((dots, ri) => glow(dots, 8, ri === 2 && t > 1.9 && t < 5.8, ri < 2 && t > 2.3 && t < 5.8));
  glow(LAMP3, 12, t > 12.0, false);
}

const tl = Motion.timeline();
tl.from('#panel', {y: 24, scale: 0.985, autoAlpha: 0, duration: 0.7, ease: 'expo.out'}, 0);
const clock = {t: 0};
tl.to(clock, {t: Motion.dur, duration: Motion.dur, ease: 'none', onUpdate() { render(clock.t); }}, 0);
// 1판 보조 문구
tl.fromTo('#note', {opacity: 0, y: 6}, {opacity: 1, y: 0, duration: 0.4}, 2.2);
tl.to('#note', {opacity: 0, y: -4, duration: 0.25, ease: 'power2.in'}, 3.35);
tl.set('#note', {textContent: '실무 활용 노선', color: AMB}, 3.6);
tl.to('#note', {opacity: 1, y: 0, duration: 0.4}, 3.9);
tl.to(['#note', '#L1', '#foot'], {opacity: 0, duration: 0.2, ease: 'power2.in', stagger: 0.04}, 5.7);
// 머리글 교체 헬퍼: 살짝 위로 빠지고 새 문구가 아래서 올라옴
function head(at, l, rr) {
  tl.to(['#hdrL', '#hdrR'], {opacity: 0, y: -4, duration: 0.18, ease: 'power2.in'}, at);
  tl.set('#hdrL', {textContent: l}, at + 0.2); tl.set('#hdrR', {textContent: rr}, at + 0.2);
  tl.fromTo(['#hdrL', '#hdrR'], {opacity: 0, y: 5}, {opacity: 1, y: 0, duration: 0.35, stagger: 0.06, immediateRender: false}, at + 0.22);
}
// 1판 → 2판: 판이 비워진 뒤 빈 타일 보드가 교체되고 새 판이 넘어온다
head(6.0, '신규 노선 · NEW SERVICE', 'FICTIONAL BRAND');
tl.to('#B1', {opacity: 0, duration: 0.2, ease: 'power2.in'}, 6.25);
tl.to('#B2', {opacity: 1, duration: 0.3, ease: 'power2.out'}, 6.35);
tl.fromTo('#B2 .plate', {y: 10}, {y: 0, duration: 0.5, ease: 'expo.out', stagger: 0.012}, 6.35);
tl.fromTo('#ring', {opacity: 0, scale: 1.12}, {opacity: 1, scale: 1, duration: 0.55, ease: 'back.out(1.6)'}, 6.7);
tl.to('#today', {opacity: 1, duration: 0.3}, 7.9);
tl.set('#foot', {textContent: '빈칸 · 예약부터 운행까지'}, 6.2);
tl.to('#foot', {opacity: 1, duration: 0.3}, 7.3);
// 2판 → 3판
tl.to(['#ring', '#today', '#foot'], {opacity: 0, duration: 0.2, ease: 'power2.in'}, 10.85);
head(11.0, '곧 상영 · COMING UP', 'AD · 16:9');

<style>

  .paper .rule{position:absolute;height:1px;background:rgba(110,90,60,.18)}

    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='300' height='300'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .3 0 0 0 0 .25 0 0 0 0 .17 0 0 0 .22 0'/></filter><rect width='300' height='300' filter='url(%23n)'/></svg>")}
  .vig{position:absolute;inset:0;z-index:29;pointer-events:none;background:radial-gradient(ellipse at 50% 50%,transparent 55%,rgba(70,50,20,.28))}
  /* 카메라 층 */
  .world{position:absolute;left:0;top:0;width:3400px;height:720px;transform-origin:0 0}
  .line{position:absolute;left:0;top:0;overflow:visible}
  .node{position:absolute;top:0;width:0;height:720px}
  .dot{position:absolute;left:-13px;top:547px;width:26px;height:26px;border-radius:50%;background:var(--ink);border:5px solid var(--np);box-shadow:0 0 0 3px var(--ink)}
  .year{position:absolute;left:-470px;top:224px;width:330px;height:150px}
  .year .bar{position:absolute;left:-10px;right:10px;top:70px;height:62px;background:var(--yel);transform-origin:0 50%;mix-blend-mode:multiply}
  .year .win{position:absolute;inset:0;overflow:hidden}
  .year .y{display:block;font-family:Pretendard;font-weight:900;font-size:150px;line-height:150px;letter-spacing:-.04em;color:var(--ink);transform:scaleX(.8);transform-origin:0 50%}
  .year .ko{position:absolute;left:4px;top:160px;font:500 15px/1 "IBM Plex Mono",monospace;letter-spacing:.14em;color:#5A4E3C;white-space:nowrap}
  .card{position:absolute;left:-110px;top:132px;width:400px;height:300px;background:#fff;padding:10px;
    box-shadow:0 2px 0 rgba(0,0,0,.08),6px 14px 22px rgba(60,40,10,.32)}
  .card svg{display:block;width:380px;height:280px}
  .tape{position:absolute;width:96px;height:30px;background:rgba(232,220,180,.82);box-shadow:0 1px 2px rgba(0,0,0,.12)}
  .tape::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 6px,rgba(255,255,255,.2) 6px 7px)}
  .lab{position:absolute;left:0;top:598px;transform:translateX(-50%);white-space:nowrap}
  .lab .slip{position:relative;background:#FBF8EF;padding:11px 22px 10px;font:800 25px/1.1 Pretendard;letter-spacing:-.02em;color:var(--ink);box-shadow:3px 5px 8px rgba(60,40,10,.25)}
  .lab .tape{left:50%;top:-16px;margin-left:-48px;transform:rotate(-4deg)}
  .mk{fill:none;stroke:var(--red);stroke-width:7;stroke-linecap:round;stroke-linejoin:round}
  .title{position:absolute;left:0;right:0;top:205px;text-align:center;opacity:0;z-index:5}

  .title p{margin:18px 0 0;font:500 17px/1 "IBM Plex Mono",monospace;letter-spacing:.3em;color:#5A4E3C}
  .title svg{position:absolute;left:-10px;top:74px;overflow:visible}
</style></head>

<script src="../../lib/gsap.min.js"></script><script src="../../lib/stage.js"></script>
<script>
const tl = Motion.timeline();
const CX = [640,1400,2160,2920];
const W = document.getElementById('world'), P = document.getElementById('paper');
// 눈금
const ticks = document.getElementById('ticks');
for (let x = 100; x < 3280; x += 38) ticks.insertAdjacentHTML('beforeend', `<path d="M${x} 554V566"/>`);

// stroke 그리기 준비
function prep(el){ const L = el.getTotalLength(); gsap.set(el,{strokeDasharray:L,strokeDashoffset:L}); return L; }
const axis = document.getElementById('axis'); const AL = prep(axis);
['mk0','mk1','mk2','mk3','ul'].forEach(id => prep(document.getElementById(id)));

// 카메라: world x = 640 - cx, 종이는 절반 속도(패럴랙스)
const cam = {x:0, y:0, s:1};
function applyCam(){ gsap.set(W,{x:cam.x,y:cam.y,scale:cam.s}); gsap.set(P,{x:cam.x*0.45,y:cam.y*0.3}); }
applyCam();
const axisTo = x => AL - (x - 60) / 3240 * AL; // x 지점까지 그린 상태의 offset

// 초기 상태
gsap.set('.node .dot',{scale:0});
gsap.set('.card',{opacity:0});
gsap.set('.year .bar',{scaleX:0});
gsap.set('.year .y',{yPercent:110});
gsap.set('.year .ko',{opacity:0});
gsap.set('.lab',{opacity:0});
gsap.set('#head',{opacity:0});
gsap.set('#hl2',{scaleX:0,transformOrigin:'0 50%'});

// 오프닝: 살짝 당겨진 카메라에서 시작
cam.s = 1.06; cam.x = -38; cam.y = -22; applyCam();
tl.to(cam,{s:1,x:0,y:0,duration:1.4,ease:'power2.out',onUpdate:applyCam},0);
tl.to(axis,{strokeDashoffset:axisTo(820),duration:1.0,ease:'power2.inOut'},0.1);

function build(i, t0){
  const n = '#n'+i;
  tl.to(n+' .dot',{scale:1,duration:0.45,ease:'back.out(2.4)'},t0);
  tl.fromTo(n+' .card',{opacity:0,y:-60,scale:1.12,rotation:i%2?9:-9},
    {opacity:1,y:0,scale:1,rotation:i%2?1.6:-2,duration:0.7,ease:'back.out(1.5)'},t0+0.1);
  tl.to(n+' .bar',{scaleX:1,duration:0.4,ease:'power2.out'},t0+0.45);
  tl.to(n+' .y',{yPercent:0,duration:0.6,ease:'power3.out'},t0+0.55);
  tl.to(n+' .ko',{opacity:1,duration:0.3},t0+0.95);
  tl.fromTo(n+' .lab',{opacity:0,scale:1.25,rotation:-5},{opacity:1,scale:1,rotation:i%2?1.2:-1.2,duration:0.35,ease:'back.out(2)'},t0+0.85);
  tl.to('#mk'+i,{strokeDashoffset:0,duration:0.6,ease:'power2.inOut'},t0+1.25);
}
function pan(i, t0, dur){
  tl.to(cam,{x:640-CX[i],duration:dur,ease:'power3.inOut',onUpdate:applyCam},t0);
  tl.to(axis,{strokeDashoffset:axisTo(CX[i]+180),duration:dur,ease:'power2.inOut'},t0);
  tl.to('#n'+(i-1),{opacity:.55,duration:dur*0.6},t0+0.1); // 초점은 하나(이전 카드는 흐리게 남김)
  // 05 원본의 휘핑 블러: 팬 가운데서만 가로 흐림
  tl.fromTo(W,{filter:'blur(0px)'},{filter:'blur(5px)',duration:dur*0.45,ease:'power2.in',yoyo:true,repeat:1,immediateRender:false},t0);
}
// 다음 카드는 팬 도중(t0+0.2)에 떨어지기 시작 → 팬 한가운데 빈 화면 없음
build(0,0.35);
pan(1,3.3,0.9);  build(1,3.5);
pan(2,6.6,0.9);  build(2,6.8);
tl.to('#hl2',{scaleX:1,duration:0.45,ease:'power2.out'},7.7);
pan(3,9.9,0.9);  build(3,10.1);
// 풀백: 전체 연표 + 제목
const S = 0.37, LEFT = 170, RIGHT = 3330;
// 12.3 풀백 → 13.85 이후 완성 정지(≥2초)
tl.to(axis,{strokeDashoffset:0,duration:0.8,ease:'power2.inOut'},12.3);
tl.to('#head',{opacity:1,duration:0.2},13.0);
tl.to(cam,{s:S,x:(1280-(LEFT+RIGHT)*S)/2,y:395-132*S,duration:1.3,ease:'power3.inOut',onUpdate:applyCam},12.3);
tl.to(['#n0','#n1','#n2'],{opacity:1,duration:0.6},12.4);
tl.to('.lab',{scale:1.9,y:14,duration:1.1,ease:'power3.inOut'},12.5);
// 연도 아래 캡션(지명·날짜)도 키워 카드 아래로 내림: 축소 0.37배에서도 읽히게
tl.to('.year .ko',{scale:2.2,y:72,color:'#3a3022',transformOrigin:'0 0',duration:1.1,ease:'power3.inOut'},12.5);
tl.fromTo('#title',{opacity:0,y:-24},{opacity:1,y:0,duration:0.6,ease:'power3.out'},12.9);
tl.to('#ul',{strokeDashoffset:0,duration:0.55,ease:'power2.inOut'},13.3);
// 홀드 전 마무리: 점이 연대순으로 한 번씩 뛰며 '이어진 130년'을 읽어 줌 + 아주 느린 밀기
[0,1,2,3].forEach(i=> tl.fromTo('#n'+i+' .dot',{scale:1},{scale:1.7,duration:.16,yoyo:true,repeat:1,ease:'power2.out'},13.95+i*.2));
tl.fromTo('#title',{scale:1},{scale:1.03,duration:1.2,ease:'sine.out',immediateRender:false},13.9);
Motion.ready();
</script></body></html>
